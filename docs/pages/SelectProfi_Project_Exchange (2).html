<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Биржа проектов · SelectProfi</title><style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

  :root {
    --bg: #F4F8F6;
    --surface: #ffffff;
    --sub: #F7FAF9;
    --line: #D7E5DF;
    --line-strong: #BFD5CC;
    --text: #12201C;
    --muted: #4E6660;
    --faint: #7F9690;
    --primary: #0F766E;
    --primary-strong: #115E59;
    --primary-soft: #E6F2EF;
    --primary-mid: #7CC4BC;
    --top: #12201C;
    --top-2: #1D302B;
    --top-line: #2E443E;
    --top-muted: #9DB3AC;
    --top-text: #E4EEEA;
    --ava: #0F766E;
    --ok: #1E6E47;
    --ok-bg: #E5F3EB;
    --warn: #9A5B08;
    --warn-bg: #FCF1DC;
    --info: #0F766E;
    --info-bg: #E6F2EF;
    --idle: #4E6660;
    --idle-bg: #EDF4F1;
    --shadow: rgba(18, 32, 28, 0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .sp-original-app {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .material-symbols-outlined { font-size: 18px; vertical-align: middle; }

  /* Topbar */
  .topbar {
    background: var(--top);
    color: var(--top-text);
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 20px;
    height: 56px;
    flex-shrink: 0;
    border-bottom: 1px solid var(--top-line);
  }
  .brand {
    font-weight: 700;
    font-size: 16px;
    letter-spacing: .01em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-badge {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: #ffffff;
    color: var(--top);
    display: grid;
    place-items: center;
    font-size: 12px;
    font-weight: 700;
  }
  .brand-tag {
    font-size: 10px;
    text-transform: uppercase;
    background: rgba(255,255,255,0.12);
    color: #A3E5D8;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  .brand small {
    font-weight: 400;
    color: var(--top-muted);
    border-left: 1px solid var(--top-line);
    padding-left: 10px;
    font-size: 13px;
  }
  .search-box {
    flex: 1;
    max-width: 520px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--top-2);
    border: 1px solid var(--top-line);
    border-radius: 6px;
    padding: 6px 12px;
    color: var(--top-muted);
    font-size: 13px;
  }
  .search-box input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--top-text);
    width: 100%;
    font: inherit;
  }
  .search-box input::placeholder { color: var(--top-muted); }
  .top-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .bell {
    position: relative;
    color: var(--top-text);
    cursor: pointer;
    display: flex;
    align-items: center;
  }
  .bell .badge {
    position: absolute;
    top: -5px;
    right: -6px;
    background: #E0A43A;
    color: var(--top);
    font-size: 10px;
    font-weight: 700;
    height: 16px;
    min-width: 16px;
    line-height: 16px;
    text-align: center;
    border-radius: 8px;
    padding: 0 4px;
  }
  .user-profile {
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: right;
    font-size: 13px;
  }
  .user-profile small { display: block; color: var(--top-muted); font-size: 11px; }
  .ava {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--ava);
    color: #fff;
    display: grid;
    place-items: center;
    font-weight: 600;
    font-size: 13px;
    border: 1.5px solid rgba(255,255,255,0.2);
  }

  /* Three Panes Layout */
  .panes {
    display: grid;
    grid-template-columns: 232px 380px minmax(0, 1fr);
    flex: 1;
    min-height: 0;
  }

  /* Navigation Sidebar (232px) */
  .nav-pane {
    background: var(--surface);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    padding: 14px 10px;
    min-height: 0;
    overflow-y: auto;
  }
  .role-indicator {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--faint);
    padding: 4px 10px 8px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .role-badge {
    background: #E6F2EF;
    color: #0F766E;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 10px;
  }
  .btn-create {
    width: 100%;
    margin: 4px 0 14px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 9px 12px;
    font-weight: 600;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .btn-create:hover { background: var(--primary-strong); }
  .nav-menu {
    display: flex;
    flex-direction: column;
    gap: 2px;
    list-style: none;
  }
  .nav-menu a {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 6px;
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.15s ease;
  }
  .nav-menu a:hover {
    background: var(--sub);
    color: var(--text);
  }
  .nav-menu a.active {
    background: var(--primary-soft);
    color: var(--primary);
    font-weight: 600;
  }
  .nav-menu a .counter {
    margin-left: auto;
    font-size: 12px;
    color: var(--faint);
    background: rgba(0,0,0,0.04);
    padding: 1px 6px;
    border-radius: 10px;
  }
  .nav-menu a.active .counter {
    color: var(--primary);
    background: rgba(15, 118, 110, 0.12);
    font-weight: 600;
  }
  .wallet-card {
    margin-top: auto;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
    background: var(--sub);
  }
  .wallet-card .wallet-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--faint);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .wallet-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    line-height: 1.4;
  }
  .wallet-row + .wallet-row { margin-top: 6px; }
  .wallet-row span { color: var(--muted); }
  .wallet-row b { color: var(--text); font-weight: 600; }
  .wallet-org {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--line);
    font-size: 11px;
    color: var(--muted);
    line-height: 1.4;
  }

  /* List Pane (380px) */
  .list-pane {
    background: var(--surface);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .list-header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--line);
  }
  .list-title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .list-title-row h1 {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }
  .sort-select {
    font-size: 12px;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 2px 6px;
    background: var(--surface);
    outline: none;
  }
  .filter-chips {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  .filter-chip {
    font-size: 12px;
    padding: 3px 9px;
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    background: var(--surface);
  }
  .filter-chip.active {
    border-color: var(--primary);
    color: var(--primary);
    background: var(--primary-soft);
    font-weight: 500;
  }
  .list-scroll {
    overflow-y: auto;
    flex: 1;
  }
  .list-group-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--faint);
    padding: 12px 16px 6px;
    background: var(--sub);
    border-bottom: 1px solid var(--line);
    font-weight: 600;
  }
  .order-row {
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    display: grid;
    gap: 4px;
    transition: background 0.1s ease;
  }
  .order-row:hover { background: var(--sub); }
  .order-row.active {
    background: var(--primary-soft);
    box-shadow: inset 3px 0 0 var(--primary);
  }
  .row-meta-top {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--faint);
  }
  .order-row strong {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
  }
  .row-meta-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--muted);
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .pill::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }
  .pill.warn { color: var(--warn); background: var(--warn-bg); }
  .pill.ok { color: var(--ok); background: var(--ok-bg); }
  .pill.info { color: var(--info); background: var(--info-bg); }

  /* Detail Pane */
  .detail-pane {
    overflow-y: auto;
    padding: 20px 28px 40px;
    background: var(--bg);
    min-width: 0;
  }
  .breadcrumbs {
    font-size: 12px;
    color: var(--faint);
    margin-bottom: 8px;
  }
  .breadcrumbs b { color: var(--muted); font-weight: 500; }
  .detail-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 14px;
  }
  .detail-header h2 {
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.25;
  }
  .detail-header .order-number {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .notice-banner {
    display: flex;
    gap: 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--warn);
    border-radius: 6px;
    padding: 14px 16px;
    margin-bottom: 16px;
    box-shadow: 0 1px 3px var(--shadow);
  }
  .notice-banner p {
    font-size: 13.5px;
    color: var(--text);
    margin-bottom: 10px;
    line-height: 1.45;
  }
  .notice-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .btn {
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--text);
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn.primary {
    background: var(--primary);
    border-color: var(--primary);
    color: #ffffff;
  }
  .btn.primary:hover { background: var(--primary-strong); }
  .btn:hover:not(.primary) { background: var(--sub); }

  /* Steps / Process Bar */
  .steps-bar {
    display: flex;
    margin-bottom: 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    list-style: none;
  }
  .steps-bar li {
    flex: 1;
    font-size: 12px;
    padding: 9px 8px 9px 12px;
    color: var(--faint);
    border-right: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .steps-bar li:last-child { border-right: none; }
  .steps-bar li.done { color: var(--muted); }
  .steps-bar li.done .check-icon { color: var(--ok); font-size: 14px; font-weight: 700; }
  .steps-bar li.now {
    color: var(--primary);
    font-weight: 600;
    background: var(--primary-soft);
  }

  /* Facts Grid */
  .facts-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    margin-bottom: 18px;
    overflow: hidden;
  }
  .fact-cell {
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }
  .fact-cell:nth-child(3n) { border-right: none; }
  .fact-cell:nth-last-child(-n+3) { border-bottom: none; }
  .fact-cell dt { font-size: 11.5px; color: var(--faint); }
  .fact-cell dd { font-size: 13px; font-weight: 500; color: var(--text); margin-top: 2px; }

  /* Tabs & Main Content */
  .detail-tabs {
    display: flex;
    gap: 20px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 14px;
  }
  .detail-tab {
    padding: 8px 2px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .detail-tab.active {
    color: var(--text);
    font-weight: 600;
    border-color: var(--primary);
  }

  /* Split layout for Table + Side */
  .detail-body-split {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 290px;
    gap: 18px;
    align-items: start;
  }
  .table-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
  }
  .table-title {
    font-size: 13px;
    font-weight: 600;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--sub);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .table-title .badge-rights {
    font-size: 11px;
    font-weight: 500;
    color: var(--primary);
    background: var(--primary-soft);
    padding: 2px 8px;
    border-radius: 4px;
  }
  table.data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  table.data-table th, table.data-table td {
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
  }
  table.data-table th {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--muted);
    background: var(--surface);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  table.data-table tr:last-child td { border-bottom: none; }
  table.data-table tr:hover td { background: var(--sub); }
  .candidate-real {
    font-weight: 600;
    color: var(--text);
  }
  .candidate-phone {
    font-size: 11px;
    color: var(--muted);
  }
  .stage-tag {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .stage-tag.shortlist { background: #E6F2EF; color: #0F766E; }
  .stage-tag.pool { background: #EDF4F1; color: #4E6660; }
  .contact-access {
    font-size: 12px;
    font-weight: 500;
    color: var(--ok);
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .table-footer-note {
    font-size: 12px;
    color: var(--muted);
    padding: 10px 14px;
    background: #FAFCFB;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Aside Cards (Docs & History) */
  .aside-section h3 {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--text);
  }
  .aside-box {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .doc-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
  }
  .doc-item:last-child { border-bottom: none; }
  .doc-item .doc-icon {
    color: var(--primary);
    font-size: 18px;
    margin-top: 1px;
  }
  .doc-item .doc-name {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text);
  }
  .doc-item .doc-meta {
    font-size: 11px;
    color: var(--muted);
  }
  .history-list {
    list-style: none;
    padding: 6px 12px;
  }
  .history-list li {
    padding: 6px 0 6px 12px;
    border-left: 2px solid var(--line);
    position: relative;
    font-size: 12px;
    line-height: 1.4;
  }
  .history-list li::before {
    content: '';
    position: absolute;
    left: -5px;
    top: 10px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--surface);
    border: 2px solid var(--line-strong);
  }
  .history-list time {
    display: block;
    font-size: 10.5px;
    color: var(--faint);
  }

</div><script>function initializeLegacy(){

const initial=()=>({role:'executor',screen:'project',detailOpen:false,tab:'pool',filter:'all',sort:'deadline',order:{id:'З-1039',title:'Менеджер по продажам B2B',customer:'ООО «Вектор»',requested:1,shortlistCount:3,status:'active',sent:false,version:1},candidates:structuredClone(seedCandidates),history:[{at:'08.11, 18:02',text:'Рекрутер добавил Ольгу Белову в рабочий список кандидатов'},{at:'28.10, 09:10',text:'Назначен исполнитель проекта'}],original:null,replacements:[],increase:null,notifications:['Заказ З-1039 требует вашего действия','В рабочем списке кандидатов 2 из 3 кандидатов'],newOrders:[]});

function modal(title,body,actions){$('modal-title').textContent=title;$('modal-body').innerHTML=body;$('modal-foot').innerHTML=actions||'<button class="btn" onclick="closeModal()">Закрыть</button>';$('modal-back').classList.add('show')};function closeModal(){$('modal-back').classList.remove('show')};function btn(label,action,cls=''){return `<button class="btn ${cls}" onclick="${action}">${label}</button>`};function setRole(role){s.role=role;s.screen='project';s.detailOpen=false;s.tab=role==='executor'?'pool':'shortlist';render()};function navigate(screen,tab){s.screen=screen;s.detailOpen=screen!=='project';if(tab)s.tab=tab;render()};function closeDetail(){s.screen='project';s.activeDraftId=null;s.detailOpen=false;render()};function primaryCreate(){s.role==='customer'?navigate('create'):openAddCandidate()};function resetDemo(){s=initial();render();toast('Демо возвращено в исходное состояние')}

function renderList(){const search=($('search')?.value||'').toLowerCase();$('list-title').textContent=s.role==='customer'?'Мои заказы':'Мои проекты в работе';$('filters').innerHTML=[['all','Все'],['active','В работе'],['completed','Выполнены']].map(([k,l])=>`<button class="filter-chip ${s.filter===k?'active':''}" onclick="s.filter='${k}';renderList()">${l}</button>`).join('');let orders=[s.order,...s.newOrders];orders=orders.filter(o=>(s.filter==='all'||(s.filter==='completed'?o.status==='completed':o.status!=='completed'))&&(`${o.title} ${o.id} ${o.customer}`.toLowerCase().includes(search)));if(s.sort==='title')orders.sort((a,b)=>a.title.localeCompare(b.title,'ru'));const status=o=>o.status==='completed'?'Выполнен':o.sent?'Отправлен':`Подготовка ${o.id===s.order.id?count():0}/${o.shortlistCount}`;$('project-list').innerHTML=orders.length?`<div class="project-table-wrap"><table class="project-table"><thead><tr><th>№ заказа</th><th>Проект / вакансия</th><th>Заказчик</th><th>Кандидаты</th><th>Статус</th><th>Срок</th><th></th></tr></thead><tbody>${orders.map(o=>`<tr class="project-tr ${s.detailOpen&&s.screen==='project'&&o.id===s.order.id?'selected':''}" tabindex="0" role="button" onclick="openOrder('${o.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openOrder('${o.id}')}" aria-label="Открыть заказ ${esc(o.id)}"><td class="project-number">${esc(o.id)}</td><td class="project-name">${esc(o.title)}</td><td>${esc(o.customer)}</td><td>${o.requested} из ${o.shortlistCount}</td><td><span class="pill ${o.status==='completed'?'ok':'warn'}">${status(o)}</span></td><td>15.11.2026</td><td class="project-chevron"><span class="badge-icon">chevron_right</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">По вашему запросу заказов нет</div>'}
function openOrder(id){if(id!==s.order.id){const draft=s.newOrders.find(o=>o.id===id);if(!draft)return toast('Заказ не найден');s.activeDraftId=id;s.screen='draft';s.detailOpen=true;render();return;}s.activeDraftId=null;s.screen='project';s.detailOpen=true;render()}

function renderProject(){let customer=s.role==='customer';let tabs=customer?[['shortlist','Список кандидатов'],['requirements','Требования вакансии'],['history','История'],['documents','Документы']]:[['pool','Кандидаты и список на выбор'],['requirements','Требования вакансии'],['history','История'],['documents','Документы']];return `<div class="stack" style="gap:17px">${header(s.order.title,customer?'Вы заказчик · ООО «Вектор»':'Вы назначены исполнителем · Заказчик ООО «Вектор»')}<div class="steps-mini"><span>✓ Заказ</span><span>✓ Назначение</span><span class="${!s.order.sent?'active':''}">3. Подготовка</span><span class="${s.order.sent&&s.order.status!=='completed'?'active':''}">4. Отправка и выбор</span><span class="${s.order.status==='completed'?'active':''}">5. Выполнен</span></div>${customer?customerBanner():executorActions()}${metrics()}<div class="tabs">${tabs.map(([k,l])=>`<button class="tab ${s.tab===k?'active':''}" onclick="s.tab='${k}';renderMain()">${l}</button>`).join('')}</div>${s.tab==='pool'?renderPool():s.tab==='shortlist'?renderShortlistContent():s.tab==='history'?renderHistoryContent():s.tab==='documents'?renderDocuments():renderRequirements()}</div>`}

function renderCreate(){if(s.role!=='customer')return '<div class="empty">Создание заказа доступно заказчику.</div>';return `<div class="stack"><div><div class="eyebrow">Новый заказ · Шаг 1 из 2</div><h2 class="section-title">Создание заказа</h2><p class="muted small">Поля и структура показаны для согласования интерфейса. Оплата в этом прототипе не подключена.</p></div><form class="panel stack" onsubmit="createOrder(event)"><label class="field">Название вакансии<input id="new-title" value="Менеджер по продажам B2B" required></label><div class="grid2"><label class="field">Сколько сотрудников нужно подобрать<input id="new-requested" type="number" min="1" value="3" required oninput="updateCreateHint()"></label><label class="field">Сколько кандидатов показать на выбор<input id="new-shortlist" type="number" min="1" value="6" required oninput="updateCreateHint()"></label></div><div class="hint" id="create-hint">Например, выбрать 3 сотрудников из 6 кандидатов. Размер списка кандидатов не может быть меньше числа сотрудников.</div><label class="field">Описание и требования<textarea id="new-description" placeholder="Опыт, обязанности, условия и ожидания"></textarea></label><div class="grid2"><label class="field">Город<input id="new-city" value="Москва"></label><label class="field">Зарплата<input id="new-salary" value="от 120 000 ₽"></label></div><div class="callout info"><strong>Гарантия и оплата</strong><div class="small">Срок гарантии и платёжные условия зависят от согласований. В демонстрации не создаются платёжные обязательства.</div></div><div class="rowx between">${btn('Отмена',"navigate('project')")}<button type="submit" class="btn primary">Сохранить черновик заказа</button></div></form></div>`}
function updateCreateHint(){let a=+$('new-requested').value,b=+$('new-shortlist').value;$('create-hint').textContent=a>0&&b>=a?`Заказчик выберет ${a} из ${b} кандидатов.`:'Ошибка: размер списка кандидатов должен быть не меньше количества сотрудников.';$('create-hint').style.color=a>0&&b>=a?'var(--muted)':'#a33333'}
function createOrder(e){e.preventDefault();let a=+$('new-requested').value,b=+$('new-shortlist').value;if(a<1||b<a){toast('Проверьте количество сотрудников и размер списка кандидатов');return}let o={id:'З-ДЕМО-'+(s.newOrders.length+1),title:$('new-title').value.trim(),customer:'ООО «Вектор»',requested:a,shortlistCount:b,status:'draft',sent:false};s.newOrders.unshift(o);addHistory(`Создан черновик заказа «${o.title}» (${a} из ${b})`);toast('Черновик создан. Оплата и публикация в демо не подключены.');closeDetail()}
function renderCandidates(){return `<div class="stack"><div class="screen-top"><h2>Моя база кандидатов</h2>${btn('+ Добавить кандидата','openAddCandidate()','primary')}</div><div class="panel">${s.candidates.map(c=>`<div class="candidate"><div><strong>${esc(c.name)}</strong><div class="desc">${esc(c.exp)}</div></div>${btn('Открыть профиль',`openProfile(${c.id})`)}</div>`).join('')}</div></div>`}
function renderHistory(){return `<div class="stack"><h2 class="section-title">История проекта</h2>${renderHistoryContent()}</div>`};function renderHistoryContent(compact=false){return `<div class="panel"><h3>${compact?'Последние действия':'Журнал действий и замен'}</h3><ol class="history">${s.history.slice(0,compact?4:50).map(h=>`<li><time>${esc(h.at)}</time><strong>${esc(h.text)}</strong></li>`).join('')}</ol>${s.original?`<div class="hint">Первоначально отправлено: ${s.original.map(x=>esc(x.name)).join(', ')}. История исходного состава неизменна.</div>`:''}</div>`}
function renderDocuments(){return `<div class="panel"><h3>Документы проекта</h3><div class="candidate"><div><strong>Договор-оферта № 1039</strong><div class="desc">Демонстрационный документ</div></div>${btn('Открыть',"toast('Документ не подключён в демонстрационном прототипе')")}</div><div class="candidate"><div><strong>Акты и расчёты</strong><div class="desc">Финансовые правила ожидают согласования</div></div><span class="tag amber">Не утверждено</span></div></div>`}

function renderMessages(){return `<div class="stack"><h2 class="section-title">Сообщения по заказу</h2><div class="panel stack"><div class="hint">Демонстрационный диалог. Отправка не уходит реальному пользователю.</div><div id="chat-items"><div class="candidate"><div><strong>Владимир Ларин</strong><div class="desc">Добрый день! Как продвигается подбор?</div></div></div></div><label class="field">Сообщение<textarea id="chat-message" placeholder="Напишите сообщение..."></textarea></label>${btn('Отправить сообщение','sendMessage()','primary')}</div></div>`};function sendMessage(){let x=$('chat-message').value.trim();if(!x){toast('Введите сообщение');return}$('chat-items').insertAdjacentHTML('beforeend',`<div class="candidate"><div><strong>Вы</strong><div class="desc">${esc(x)}</div></div></div>`);$('chat-message').value='';addHistory('Отправлено сообщение в демонстрационном чате');toast('Сообщение добавлено в демо-чат')}
function renderMarket(){return `<div class="stack"><h2 class="section-title">Биржа заказов</h2><div class="panel"><div class="candidate"><div><strong>Менеджер по продажам B2B</strong><div class="desc">Москва · заказ З-1039 · пример карточки биржи</div></div>${btn('Посмотреть заказ',"openOrder('З-1039')",'primary')}</div><div class="hint">Отклики, переговоры и резерв исполнителей будут спроектированы в отдельном модуле.</div></div></div>`}
function openCountModal(){if(s.order.sent){toast('После отправки размер списка кандидатов менять нельзя');return}modal('Изменить размер списка кандидатов',`<div class="stack"><p class="small muted">Сейчас требуется ${s.order.shortlistCount} кандидатов. Минимум — ${s.order.requested}.</p><label class="field">Новый размер списка кандидатов<input id="count-input" type="number" min="${s.order.requested}" value="${s.order.shortlistCount}"></label><div class="hint">Уменьшение применяется сразу. Увеличение требует явного подтверждения исполнителя.</div></div>`,`${btn('Отмена','closeModal()')}${btn('Продолжить','saveCount()','primary')}`)}
function saveCount(){if(s.order.sent||s.role!=='customer')return toast('Изменение доступно только заказчику до отправки');let n=+$('count-input').value;if(!Number.isInteger(n)||n<s.order.requested){toast('Размер списка кандидатов не может быть меньше числа сотрудников');return}if(n===s.order.shortlistCount){closeModal();return}if(n>s.order.shortlistCount){s.increase=n;addHistory(`Заказчик запросил увеличение списка кандидатов до ${n}`);notify(`Запрос увеличить список кандидатов до ${n}`);closeModal();render();toast('Запрос отправлен исполнителю. Размер пока не изменён.');return}s.order.shortlistCount=n;s.order.version++;addHistory(`Заказчик уменьшил размер списка кандидатов до ${n}`);notify(`Размер списка кандидатов уменьшен до ${n}`);closeModal();render();toast('Новый размер сохранён')}
function acceptIncrease(){if(!s.increase||s.order.sent){toast('Изменение размера уже недоступно');return;}s.order.shortlistCount=s.increase;s.increase=null;s.order.version++;addHistory(`Исполнитель подтвердил увеличение списка кандидатов до ${s.order.shortlistCount}`);notify('Исполнитель согласовал увеличение списка кандидатов');render();toast('Новый размер согласован')};function rejectIncrease(){if(!s.increase||s.order.sent){toast('Запрос недоступен');return;}addHistory(`Исполнитель отказал в увеличении до ${s.increase}`);notify('Исполнитель отклонил запрос увеличения');s.increase=null;render();toast('Запрос отклонён')}
function addToShortlist(id){if(s.order.sent)return toast('Список уже официально отправлен');if(count()>=s.order.shortlistCount)return toast('Рабочий список кандидатов заполнен');let c=s.candidates.find(x=>x.id===id);c.stage='shortlist';addHistory(`Добавлен в рабочий список кандидатов: ${c.name}`);render();toast('Кандидат добавлен в рабочий список, заказчику ещё не отправлен')};function removeFromShortlist(id){if(s.order.sent)return toast('После отправки удалить нельзя');let c=s.candidates.find(x=>x.id===id);c.stage='pool';addHistory(`Возвращён в Pool: ${c.name}`);render()}
function openSubmit(){if(s.order.sent)return toast('Список уже отправлен');if(count()!==s.order.shortlistCount)return toast(`Нужен полный список кандидатов: ${count()} из ${s.order.shortlistCount}`);modal('Отправить полный список кандидатов?',`<p>Заказчик получит <strong>${count()} кандидатов</strong>. Исходный состав будет зафиксирован.</p><div class="callout" style="margin-top:12px">После отправки нельзя менять размер списка или односторонне отказаться от заказа. Замена выбывшего невыбранного кандидата сохранит историю.</div>`,`${btn('Назад','closeModal()')}${btn('Подтвердить отправку','submitShortlist()','primary')}`)};function submitShortlist(){if(s.order.sent||count()!==s.order.shortlistCount)return toast('Состав изменился. Проверьте список.');s.original=s.candidates.filter(c=>c.stage==='shortlist').map(c=>({id:c.id,name:c.name}));s.order.sent=true;addHistory(`Официально отправлен полный список кандидатов: ${s.original.map(c=>c.name).join(', ')}`);notify('Полный список кандидатов отправлен заказчику');closeModal();render();toast('Список кандидатов официально отправлен')}
function openProfile(id){let c=s.candidates.find(x=>x.id===id);if(s.role==='customer'&&(!s.order.sent||c.stage!=='shortlist'))return toast('Заказчик видит только официально отправленных кандидатов');modal(c.name,`<div class="stack"><span class="tag">${c.stage==='shortlist'?'Список кандидатов':'Pool'}</span><p><strong>Опыт:</strong> ${esc(c.exp)}</p><p><strong>Источник:</strong> ${esc(c.source)}</p><p class="hint">Профиль демонстрационный. Контактные данные и записи интервью здесь намеренно не раскрываются.</p></div>`,`${btn('Закрыть','closeModal()')}${s.role==='customer'&&s.order.sent&&!c.selected&&s.order.status!=='completed'?btn('Выбрать кандидата',`closeModal();openSelect(${id})`,'primary'):''}`)}
function openSelect(id){if(s.role!=='customer'||!s.order.sent)return toast('Выбор доступен только заказчику после отправки');let c=s.candidates.find(x=>x.id===id);if(!c||c.stage!=='shortlist'||c.selected||selected()>=s.order.requested)return toast('Кандидата нельзя выбрать');modal('Окончательно выбрать кандидата?',`<p>Вы подтверждаете выбор <strong>${esc(c.name)}</strong> по заказу ${esc(s.order.id)}.</p><div class="callout info" style="margin-top:12px">После окончательного выбора обычная замена недоступна. При невыходе используется гарантийная процедура.</div>`,`${btn('Отмена','closeModal()')}${btn('Подтвердить выбор',`selectCandidate(${id})`,'primary')}`)};function selectCandidate(id){if(s.role!=='customer'||!s.order.sent)return toast('Выбор доступен только заказчику после отправки');let c=s.candidates.find(x=>x.id===id);if(!c||c.selected||c.stage!=='shortlist'||selected()>=s.order.requested)return toast('Выбор недоступен');c.selected=true;addHistory(`Заказчик окончательно выбрал кандидата: ${c.name}`);if(selected()===s.order.requested){s.order.status='completed';addHistory('Заказ автоматически перешёл в состояние «Выполнен»');notify('Заказ выполнен: выбрано нужное число кандидатов')}closeModal();render();toast('Выбор сохранён. Автоматических выплат не производится.')}
function openReplacement(id){if(!s.order.sent||s.role!=='executor')return toast('Замена недоступна');let c=s.candidates.find(x=>x.id===id);if(!c||c.selected||c.stage!=='shortlist')return toast('Выбранного кандидата можно заменить только через гарантию');let opts=s.candidates.filter(x=>x.stage==='pool');if(!opts.length)return toast('Для замены сначала добавьте нового кандидата в базу');modal('Замена выбывшего кандидата',`<div class="stack"><p>Выбывший кандидат: <strong>${esc(c.name)}</strong></p><label class="field">Новый кандидат<select id="replacement-id">${opts.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label><label class="field">Основание выбытия<textarea id="replacement-reason" placeholder="Например: кандидат отказался от участия"></textarea></label><div class="hint">Исходный состав официального списка сохранится. Заказчик увидит обновлённый список и историю замены.</div></div>`,`${btn('Отмена','closeModal()')}${btn('Подтвердить замену',`replaceCandidate(${id})`,'primary')}`)}
function replaceCandidate(id){if(s.role!=='executor'||!s.order.sent)return toast('Замена недоступна');let old=s.candidates.find(x=>x.id===id),n=s.candidates.find(x=>x.id===+$('replacement-id').value),reason=$('replacement-reason').value.trim();if(!reason){toast('Укажите причину выбытия');return}if(!old||old.selected||old.stage!=='shortlist'||!n||n.stage!=='pool')return toast('Нельзя выполнить замену');old.stage='withdrawn';n.stage='shortlist';s.replacements.push({old:old.name,new:n.name,reason});addHistory(`Замена выбывшего кандидата: ${old.name} → ${n.name}. Причина: ${reason}`);notify(`Изменился состав списка кандидатов: ${old.name} заменён на ${n.name}`);closeModal();render();toast('Замена сохранена, заказчик уведомлён')}
function openAddCandidate(){modal('Добавить кандидата в Pool',`<div class="stack"><label class="field">ФИО<input id="candidate-name" placeholder="Имя и фамилия"></label><label class="field">Опыт и квалификация<input id="candidate-exp" placeholder="Например: 5 лет, B2B-продажи"></label><div class="hint">В настоящем продукте требуется подтверждение кандидата и законное основание обработки данных. В демо создаётся только тестовая запись.</div></div>`,`${btn('Отмена','closeModal()')}${btn('Добавить в Pool','addCandidate()','primary')}`)};function addCandidate(){let name=$('candidate-name').value.trim(),exp=$('candidate-exp').value.trim();if(!name||!exp)return toast('Заполните ФИО и опыт');let id=Math.max(...s.candidates.map(x=>x.id))+1;s.candidates.push({id,name,exp,source:'Добавлен вручную',stage:'pool',selected:false});addHistory(`Добавлен в Pool: ${name}`);closeModal();render();toast('Тестовый кандидат добавлен в Pool')}
function showNotifications(){modal('Уведомления',`<div class="stack">${s.notifications.length?s.notifications.map(n=>`<div class="hint">${esc(n)}</div>`).join(''):'<p class="muted">Новых уведомлений нет</p>'}</div>`,`${btn('Закрыть','closeModal()')}${btn('Отметить прочитанными','clearNotifications()','primary')}`)};function clearNotifications(){s.notifications=[];closeModal();render()};Object.defineProperty(window,'s',{configurable:true,get:()=>s,set:value=>{s=value}});

function addApplicantV3(id){

 s.candidates.push(candidate);addHistory(`Соискатель ${app.name} добавлен из откликов в кандидаты`);s.tab="pool";renderMain();toast("Отклик добавлен в кандидаты проекта");

function basePersonInProjectV5(profile){return s.candidates.some(x=>x.baseCandidateId===profile.id||x.name===profile.name);}

function renderBaseListV5(){

function addBaseCandidateV5(id){
 const p=s.candidateBaseV5.find(x=>x.id===id);if(!p)return;
 if(basePersonInProjectV5(p))return toast("Кандидат уже есть в проекте");
 s.candidates.push({id:s.nextCandidateId++,baseCandidateId:p.id,name:p.name,exp:p.experience,stage:"pool",selected:false,source:"Моя база"});
 addHistory(`Кандидат ${p.name} добавлен в проект из своей базы`);
 renderMain();toast(`${p.name} добавлен в кандидаты проекта`);
}

function showResumeFileV5(){
 const file=$("candidate-resume-file-v5")?.files?.[0],label=$("add-file-name-v5");
 if(label)label.textContent=file?file.name+" · "+Math.max(1,Math.ceil(file.size/1024))+" КБ":"Файл пока не выбран";
}

function saveResumeCandidateV5(){
 const file=$("candidate-resume-file-v5")?.files?.[0],name=$("candidate-name-v5")?.value?.trim(),exp=$("candidate-exp-v5")?.value?.trim();
 const note=$("candidate-note-v5")?.value?.trim();
 if(!file)return toast("Выберите файл резюме");
 if(!name||!exp)return toast("Укажите ФИО и опыт кандидата");
 if(!/\.(pdf|doc|docx|txt)$/i.test(file.name))return toast("Поддерживаются PDF, DOC, DOCX и TXT");
 if(s.candidates.some(c=>c.name.toLowerCase()===name.toLowerCase()))return toast("Кандидат с таким ФИО уже есть в проекте");
 const id=s.nextCandidateId++;
 s.candidates.push({id,name,exp,stage:"pool",selected:false,source:note||"Загружено резюме"});
 s.documents.unshift({id:Date.now(),name:file.name,type:"Резюме",target:name,date:new Date().toLocaleDateString("ru-RU"),url:URL.createObjectURL(file)});
 addHistory(`Добавлен кандидат ${name} и прикреплено резюме`);
 s.resumeFeedbackV5=name;s.candidateSourceV5="base";renderMain();toast(`${name} добавлен в проект`);
}

 [1045,'Инженер-технолог','Технолит','Т','Производство','Казань','Офис',65000,12,1,'Опыт работы на металлообрабатывающем предприятии и разработки технологических карт.'],
 [1044,'Менеджер по работе с клиентами','Линия','Л','Продажи','Москва','Гибрид',55000,10,1,'Опыт ведения корпоративных клиентов и переговоров о продлении договоров.'],
 [1043,'Системный аналитик','Спектр','СП','ИТ','Россия','Удалённо',90000,20,3,'Опыт сбора требований и описания интеграций. Умение читать схемы данных и документировать API.']
].map(([id,title,company,logo,field,city,mode,fee,days,warranty,requirements])=>({id,title,company,logo,field,city,mode,fee,days,warranty,requirements}));
function marketIcon(path){return '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+path+'"/></svg>'}
const bookmark=marketIcon('M6 4h12v17l-6-4-6 4z');
const pin=marketIcon('M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0z M14 10a2 2 0 1 1-4 0 2 2 0 1 1 4 0');
const companies=['Форма','Север Групп','Контур Софт','Технолит','Линия','Спектр','Вектор','Атлас','Модуль','Маяк','Альта','Горизонт'];
const cities=['Москва','Санкт-Петербург','Казань','Екатеринбург','Новосибирск','Самара'];
const salaries=[160000,180000,210000,105000,85000,170000];
const orders=Array.from({length:10000},(_,i)=>{
 const t=templates[i%templates.length], batch=Math.floor(i/templates.length);
 const fee=t.fee+(batch*7%23)*1000;
 const warranty=(i+2)%4;
 const min=salaries[i%templates.length]+(batch*3%13)*5000;
 return {...t,id:21000-i,company:companies[(i+batch*5)%companies.length],
 city:t.mode==='Удалённо'?'Россия':cities[(i+batch)%cities.length],min,max:min+30000+(i%4)*10000,fee,warranty,bonus:warranty?Math.round(fee*(0.08+warranty*0.04)/500)*500:0};
});
const market={view:'feed',detail:null,offset:0,tab:'all',query:'',field:'',mode:'',warranty:'',minFee:'',sort:'new',page:1,size:25,saved:new Set(),responses:new Map()};
const number=n=>n.toLocaleString('ru-RU');
const dayText=n=>n+' '+(n%10===1&&n%100!==11?'день':n%10>=2&&n%10<=4&&!(n%100>=12&&n%100<=14)?'дня':'дней');
const warrantyText=o=>o.warranty?o.warranty+' мес.':'Без гарантии';
const options=(items,value)=>items.map(([key,label])=>`<option value="${key}" ${String(key)===String(value)?'selected':''}>${label}</option>`).join('');
function filteredMarket(){
 const words=market.query.toLowerCase().trim().split(/\s+/).filter(Boolean);
 const rows=orders.filter(o=>(market.tab==='all'||(market.tab==='saved'?market.saved:market.responses).has(o.id))&&(!market.field||market.field===o.field)&&(!market.mode||market.mode===o.mode)&&(!market.warranty||(market.warranty==='yes')===Boolean(o.warranty))&&o.fee>=Number(market.minFee)&&words.every(w=>(o.title+' '+o.company+' '+o.city+' З-'+o.id).toLowerCase().includes(w)));
 if(market.sort==='fee') rows.sort((a,b)=>b.fee-a.fee);
 if(market.sort==='salary') rows.sort((a,b)=>b.max-a.max);
 if(market.sort==='bonus') rows.sort((a,b)=>b.bonus-a.bonus);
 return rows;
}
function marketRow(o){return `<tr><td><button class="vacancy" onclick="marketDetails(${o.id})">${o.title}</button><small>${o.company} · З-${o.id}</small>${market.responses.has(o.id)?'<small class="answered">Отклик отправлен</small>':''}</td><td data-label="Место работы">${o.city}<small>${o.mode}</small></td><td data-label="Зарплата в месяц">${number(o.min)}–${number(o.max)} ₽</td><td class="fee" data-label="За подбор">${moneyV3(o.fee)}</td><td data-label="За гарантию">${o.bonus?moneyV3(o.bonus):'—'}<small>${warrantyText(o)}</small></td><td><button class="market-save" aria-label="${market.saved.has(o.id)?'Убрать из избранного':'В избранное'}" aria-pressed="${market.saved.has(o.id)}" onclick="marketBookmark(${o.id})">${bookmark}</button></td></tr>`}
function marketFeed(o){
 return `<article class="feed-item" onclick="if(!event.target.closest('button'))marketDetails(${o.id})"><div><small>${o.company} · ${o.city} · ${o.mode}</small><button class="feed-title" onclick="marketDetails(${o.id})">${o.title}</button><p>${o.requirements}</p><small>Зарплата кандидата · ${number(o.min)}–${moneyV3(o.max)} / мес.</small></div><aside><small>За подбор</small><strong>${moneyV3(o.fee)}</strong><span>${o.bonus?'За гарантию +'+moneyV3(o.bonus)+' · '+warrantyText(o):'Без гарантии'}</span><small>Срок подбора · ${dayText(o.days)}</small></aside><div class="feed-actions"><button aria-label="Избранное" class="market-save" aria-pressed="${market.saved.has(o.id)}" onclick="marketBookmark(${o.id})">${bookmark}</button>${market.responses.has(o.id)?'<small class="answered">Отклик отправлен</small>':''}</div></article>`;
}
function marketLayout(v){market.view=v;refreshMarket()}
function marketResults(){
 const rows=filteredMarket(),pages=Math.max(1,Math.ceil(rows.length/market.size));market.page=Math.min(pages,Math.max(1,Number(market.page)||1));
 const start=(market.page-1)*market.size;
 const buttons=[...new Set([1,market.page-1,market.page,market.page+1,pages])].filter(n=>n>=1&&n<=pages).sort((a,b)=>a-b);
 const pageLinks=buttons.map((n,i)=>(i&&n-buttons[i-1]>1?' <span>…</span> ':'')+`<button ${n===market.page?'aria-current="page"':''} onclick="marketPage(${n})">${n}</button>`).join('');
 return `<div class="result-bar"><strong>Найдено проектов · ${number(rows.length)}</strong><div class="view-toggle" aria-label="Вид выдачи">${[['feed','Лента'],['table','Таблица']].map(([v,label])=>`<button aria-pressed="${market.view===v}" onclick="marketLayout('${v}')">${label}</button>`).join('')}</div><select aria-label="Сортировка" onchange="marketSet('sort',this.value)">${options([['new','Сначала новые'],['salary','По зарплате кандидата ↓'],['fee','По оплате за подбор ↓'],['bonus','По оплате за гарантию ↓']],market.sort)}</select></div>${rows.length?`${market.view==='feed'?`<div class="feed-list">${rows.slice(start,start+market.size).map(marketFeed).join('')}</div>`:`<div class="exchange-scroll"><table class="exchange-table"><thead><tr><th>Вакансия / заказчик</th><th>Место работы</th><th>Зарплата кандидата<small>в месяц</small></th><th>Исполнителю<small>за подбор</small></th><th>Исполнителю<small>за гарантию</small></th><th aria-label="Избранное"></th></tr></thead><tbody>${rows.slice(start,start+market.size).map(marketRow).join('')}</tbody></table></div>`}<div class="market-pages"><span>${number(start+1)}–${number(Math.min(rows.length,start+market.size))} из ${number(rows.length)}</span><nav aria-label="Страницы биржи">${pageLinks}</nav><label>По <select aria-label="Строк на странице" onchange="marketSet('size',Number(this.value))">${options([10,25,50,100].map(n=>[n,n]),market.size)}</select></label></div>`:`<div class="market-empty"><strong>${market.tab==='saved'?'Нет подходящих избранных проектов':market.tab==='responses'?'Нет подходящих откликов':'Проекты не найдены'}</strong><p>${market.tab==='saved'?'Добавляйте проекты с помощью закладки в строке заказа.':market.tab==='responses'?'Отправленные отклики появятся здесь.':'Попробуйте изменить запрос или фильтры.'}</p><button class="btn" onclick="marketReset()">Показать все проекты</button></div>`}`;
}
function marketView(){

function inboxRender(){
 const box=inboxState(),t=box.threads.find(t=>t.id===box.active);
 $('main').innerHTML=`<div class="msg-page"><header><h1>Сообщения</h1></header><div class="msg-shell ${box.mobileChat?'reading':''}"><aside class="msg-nav"><div class="msg-search"><label>${marketIcon('M16 16l5 5 M18 10a8 8 0 1 1-16 0 8 8 0 1 1 16 0')}<input type="search" aria-label="Поиск диалогов" placeholder="Имя, роль или проект" value="${esc(box.query)}" oninput="inboxSearch(this.value)"></label></div><div id="msg-rows">${inboxRows()}</div></aside><section class="msg-chat"><header class="msg-header"><button class="btn msg-back" aria-label="Назад к диалогам" onclick="inboxList()">←</button><span class="msg-avatar av-${t.id}">${t.initials}</span><div><h2>${esc(t.name)}</h2><small>${esc(t.role)} · ${esc(t.context)}</small></div>${t.id==='client'?btn('К проекту','openOrder(s.order.id)'):''}</header><div class="msg-log" id="msg-log" role="log" aria-label="Переписка">${t.items.map(m=>`<div class="msg-bubble ${m.mine?'outgoing':''}"><p>${esc(m.text)}</p><time>${m.mine?'Вы · ':''}${esc(m.time)}</time></div>`).join('')}</div><form class="msg-form" onsubmit="event.preventDefault();inboxSend()"><div class="msg-compose"><div class="msg-compose-tools"><button type="button" class="msg-tool msg-plus" aria-label="Прикрепить или запланировать" aria-expanded="${box.attachOpen}" onclick="inboxToggleAttach()">+</button><div class="msg-attach-menu" ${box.attachOpen?'':'hidden'}><label class="msg-menu-item">Аудио<input type="file" accept="audio/*" onchange="inboxAttach(this.files[0])"></label><label class="msg-menu-item">Видео<input type="file" accept="video/*" onchange="inboxAttach(this.files[0])"></label><label class="msg-menu-item">Файл<input type="file" onchange="inboxAttach(this.files[0])"></label><button type="button" class="msg-menu-item" onclick="inboxSchedule()">Запланировать встречу</button></div><span class="msg-disabled-wrap" title="Аудио- и видеозвонки пока временно недоступны"><button type="button" class="msg-tool" disabled aria-label="Аудиозвонок">☎</button></span><span class="msg-disabled-wrap" title="Аудио- и видеозвонки пока временно недоступны"><button type="button" class="msg-tool" disabled aria-label="Видеозвонок">▣</button></span><span class="msg-disabled-wrap msg-voice-wrap" title="Запись голосовых сообщений пока временно недоступна"><button type="button" class="msg-tool" disabled aria-label="Записать голосовое">🎙</button></span></div><textarea rows="2" aria-label="Текст сообщения" placeholder="Напишите сообщение…" oninput="inboxDraft(this.value)" onkeydown="if(event.key==='Enter'&&(event.ctrlKey||event.metaKey)){event.preventDefault();inboxSend()}">${esc(box.drafts[t.id]||'')}</textarea><button id="msg-send" class="btn primary" ${box.drafts[t.id]?.trim()?'':'disabled'}>Отправить</button></div></form></section></div></div>`;
 const log=$('msg-log');log.scrollTop=log.scrollHeight;
}
function inboxToggleAttach(){const box=inboxState();box.attachOpen=!box.attachOpen;inboxRender()}
function inboxAttach(file){if(!file)return;const box=inboxState(),t=box.threads.find(t=>t.id===box.active);t.items.push({mine:true,time:new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}),text:'Прикреплён файл: '+file.name});box.attachOpen=false;inboxRender();toast('Файл добавлен в переписку')}
function inboxSchedule(){
 inboxState().attachOpen=false;
 modal('Запланировать встречу',`<div class="stack"><label class="field">Тема встречи<input id="meeting-title" value="Обсуждение вакансии"></label><label class="field">Дата<input id="meeting-date" type="date" required></label><label class="field">Время<input id="meeting-time" type="time" required></label><label class="field">Формат<select id="meeting-type"><option>Аудиозвонок</option><option>Видеозвонок</option><option>Встреча в чате</option></select></label><p class="small muted">Участник получит предложение о встрече в этом диалоге.</p></div>`,btn('Отмена','closeModal()')+btn('Отправить приглашение','inboxScheduleSave()','primary'));
}
function inboxScheduleSave(){
 const title=$('meeting-title').value.trim(),date=$('meeting-date').value,time=$('meeting-time').value;
 if(!title||!date||!time)return toast('Укажите тему, дату и время');
 const box=inboxState(),t=box.threads.find(t=>t.id===box.active),kind=$('meeting-type').value;
 const formatted=new Date(date+'T00:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});if(typeof allMeetings==='function')allMeetings().push({id:Date.now(),orderId:s.order.id,title,who,type,date,time,note});
 t.items.push({mine:true,time:new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}),text:`Приглашение на встречу: ${title} · ${formatted} в ${time} · ${kind}`});
 closeModal();inboxRender();toast('Приглашение добавлено в диалог');
}
function inboxSelect(id){const box=inboxState();box.active=id;box.mobileChat=true;inboxRender()}
function inboxList(){inboxState().mobileChat=false;inboxRender()}
function inboxSearch(v){inboxState().query=v;$('msg-rows').innerHTML=inboxRows()}
function inboxDraft(v){const box=inboxState();box.drafts[box.active]=v;$('msg-send').disabled=!v.trim()}
function inboxSend(){
 const box=inboxState(),t=box.threads.find(t=>t.id===box.active),text=box.drafts[t.id]?.trim();
 if(!text)return;
 t.items.push({mine:true,time:new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}),text});box.drafts[t.id]='';
 box.threads=[t,...box.threads.filter(other=>other!==t)];if(t.id==='client')addHistory('Отправлено сообщение заказчику');
 inboxRender();document.querySelector('.msg-form textarea')?.focus();
}
Object.assign(window,{inboxSelect,inboxList,inboxSearch,inboxSend,inboxDraft,inboxToggleAttach,inboxAttach,inboxSchedule,inboxScheduleSave});
const beforeInbox=renderMain;
renderMain=function(){
 const active=s.screen==='messages'&&s.role==='executor';
 $('panes').classList.toggle('inbox-open',active);
 if(active){$('panes').classList.remove('directory-open','add-candidate-layout-v5');$('panes').classList.add('market-open');inboxRender();return}beforeInbox()
};
const originalDrawer=openChatDrawer;
openChatDrawer=function(){if(s.role!=='executor')return originalDrawer();const box=inboxState();box.active='client';box.query='';box.mobileChat=true;navigate('messages')};
window.openChatDrawer=openChatDrawer;
s.screen='messages';s.detailOpen=true;

function plannerState(){if(!s.planner){const d=new Date();s.planner={year:d.getFullYear(),month:d.getMonth(),selected:isoDay(d.getFullYear(),d.getMonth(),d.getDate())}}return s.planner}
function allMeetings(){if(!s.meetings)s.meetings=[];return s.meetings}
function isoDay(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function changePlanner(delta){const p=plannerState(),d=new Date(p.year,p.month+delta,1);p.year=d.getFullYear();p.month=d.getMonth();p.selected=isoDay(p.year,p.month,1);renderMain()}
function plannerSelect(day){plannerState().selected=day;renderMain()}
function meetingForm(orderOnly=false){
 const now=plannerState(),day=orderOnly?now.selected:now.selected;
 modal('Запланировать встречу',`<div class="stack"><label class="field">Тема встречи<input id="plan-title" value="${esc(s.order.title)}"></label><label class="field">С кем встреча<select id="plan-with"><option>Заказчик · Владимир Ларин</option><option>Кандидат · Виктория Андреева</option><option>Другое</option></select></label><label class="field">Формат<select id="plan-type"><option>Видеозвонок</option><option>Аудиозвонок</option><option>Встреча в чате</option><option>Личная встреча</option></select></label><div class="rowx"><label class="field">Дата<input type="date" id="plan-date" value="${day}"></label><label class="field">Время<input type="time" id="plan-time" value="15:00"></label></div><label class="field">Заметка<textarea id="plan-note" placeholder="Повестка или что подготовить"></textarea></label></div>`,btn('Отмена','closeModal()')+btn('Сохранить встречу','plannerSave('+orderOnly+')','primary'));
}
function plannerSave(orderOnly){
 const title=$('plan-title').value.trim(),date=$('plan-date').value,time=$('plan-time').value;
 if(!title||!date||!time)return toast('Укажите тему, дату и время');
 const who=$('plan-with').value,type=$('plan-type').value,note=$('plan-note').value.trim();
 allMeetings().push({id:Date.now(),orderId:s.order.id,title,who,type,date,time,note});
 closeModal();if(orderOnly){s.tab='meetings';renderMain()}else renderMain();toast('Встреча добавлена в календарь');
}
function meetingCard(m){
 return `<article class="meet-card"><time>${esc(m.time)}</time><div><b>${esc(m.title)}</b><small>${esc(m.who)} · Заказ ${esc(m.orderId)}</small>${m.note?`<p>${esc(m.note)}</p>`:''}</div><span class="meet-type">${esc(m.type)}</span></article>`;
}
function calendarGrid(){
 const p=plannerState(),now=new Date(),today=isoDay(now.getFullYear(),now.getMonth(),now.getDate()),first=new Date(p.year,p.month,1),offset=(first.getDay()+6)%7,days=new Date(p.year,p.month+1,0).getDate();
 return '<div class="calendar-grid">'+['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>'<b>'+x+'</b>').join('')+Array.from({length:offset},()=>'<span></span>').join('')+Array.from({length:days},(_,i)=>{const day=isoDay(p.year,p.month,i+1),has=allMeetings().some(m=>m.date===day);return `<button class="${day===p.selected?'selected ':''}${day===today?'today ':''}${has?'has-meeting ':''}" onclick="plannerSelect('${day}')">${i+1}${has?'<i></i>':''}</button>`}).join('')+'</div>'
}
function renderCalendar(){
 const p=plannerState(),meetings=allMeetings().filter(m=>m.date===p.selected).sort((a,b)=>a.time.localeCompare(b.time)),label=new Date(p.year,p.month,1).toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
 return `<div class="planner"><header class="planner-head"><div><div class="market-crumb">Кабинет менеджера</div><h1>Календарь встреч</h1><p>Встречи с заказчиками и кандидатами</p></div>${btn('+ Запланировать встречу','meetingForm(false)','primary')}</header><div class="planner-layout"><section class="calendar-panel"><header><button onclick="changePlanner(-1)" aria-label="Предыдущий месяц">‹</button><h2>${label}</h2><button onclick="changePlanner(1)" aria-label="Следующий месяц">›</button></header>${calendarGrid()}<div class="calendar-legend"><i></i> Запланирована встреча</div></section><section class="agenda"><h2>${new Date(p.selected+'T00:00:00').toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}</h2><div class="agenda-list">${meetings.map(meetingCard).join('')||'<div class="market-empty"><strong>На этот день встреч нет</strong><p>Выберите дату с отметкой или запланируйте новую встречу.</p><button class="btn primary" onclick="meetingForm(false)">Запланировать встречу</button></div>'}</div></section></div></div>`;
}
function renderProjectMeetings(){
 const meetings=allMeetings().filter(m=>m.orderId===s.order.id).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 return `<section class="project-meetings"><header><div><h2>Встречи по проекту</h2><p>Разговоры с заказчиком и кандидатами по заказу ${esc(s.order.id)}</p></div>${btn('+ Запланировать встречу','meetingForm(true)','primary')}</header><div class="agenda-list">${meetings.map(meetingCard).join('')||'<div class="market-empty"><strong>Встречи пока не запланированы</strong><p>Здесь будут отображаться встречи с заказчиком и кандидатами по этому проекту.</p></div>'}</div></section>`;
}
Object.assign(window,{plannerState,changePlanner,plannerSelect,meetingForm,plannerSave});
const previousPlannerRender=renderMain;
renderMain=function(){
 if(s.screen==='calendar'){ $('panes').classList.add('market-open');$('panes').classList.remove('inbox-open','directory-open');$('main').innerHTML=renderCalendar();return}
 previousPlannerRender();
};

const hotkeys=e=>{if(e.key==='Escape')closeModal();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('search')?.focus()}};document.addEventListener('keydown',hotkeys);render();hydrateIcons();return ()=>{document.removeEventListener('keydown',hotkeys);iconObserver.disconnect()};

}

initializeLegacy()</script></html>
