<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10 · Табло</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Rubik:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* New palette: black + signal yellow. Departure-board metaphor: big figures, status rows. */
  :root { --bg:#0E0E0E; --tile:#1A1A1A; --line:#2B2B2B; --text:#F3F1EA; --muted:#8F8C84; --y:#FFD23F; --ok:#5DD39E; --warn:#FF8A3D; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 Rubik, system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:24px; padding:14px 28px; border-bottom:4px solid var(--y); flex-wrap:wrap; }
  .brand { font:600 20px Oswald, sans-serif; letter-spacing:.06em; text-transform:uppercase; }
  .brand span { color:var(--y); }
  nav { display:flex; gap:4px; flex-wrap:wrap; }
  nav a { color:var(--muted); text-decoration:none; padding:6px 10px; text-transform:uppercase; font-size:12px; letter-spacing:.08em; }
  nav a:first-child { background:var(--y); color:#111; }
  .clock { margin-left:auto; font:500 22px Oswald, sans-serif; color:var(--y); }
  main { padding:24px 28px 90px; }
  .head { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
  h1 { font:600 34px/1.1 Oswald, sans-serif; text-transform:uppercase; margin:0; max-width:820px; }
  .btn { background:var(--y); color:#111; border:0; padding:12px 20px; font:600 15px Oswald, sans-serif; text-transform:uppercase; letter-spacing:.06em; cursor:pointer; }
  .tiles { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin-bottom:28px; }
  .tile { background:var(--tile); padding:16px; border-top:3px solid var(--line); }
  .tile:first-child { border-top-color:var(--y); }
  .tile span { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  .tile b { display:block; font:600 46px/1.1 Oswald, sans-serif; margin:6px 0 2px; font-variant-numeric:tabular-nums; }
  .tile small { color:var(--muted); }
  .board { width:100%; border-collapse:separate; border-spacing:0 6px; }
  .board th { text-align:left; font:500 12px Oswald, sans-serif; letter-spacing:.12em; text-transform:uppercase; color:var(--y); padding:0 14px; }
  .board td { background:var(--tile); padding:14px; font-size:16px; }
  .board td:first-child { font-weight:500; }
  .board td.num { font:500 18px Oswald, sans-serif; text-align:right; white-space:nowrap; }
  .st { font:600 13px Oswald, sans-serif; letter-spacing:.08em; text-transform:uppercase; white-space:nowrap; }
  .st.ok { color:var(--ok); } .st.warn { color:var(--warn); } .st.idle { color:var(--muted); }
  .ticker { margin-top:24px; border-top:1px solid var(--line); padding-top:14px; display:flex; gap:28px; overflow-x:auto; color:var(--muted); font-size:14px; }
  .ticker b { color:var(--y); font-weight:500; margin-right:6px; }
  .ticker span { white-space:nowrap; }
  #role-switch { position:fixed; bottom:0; left:0; right:0; display:flex; background:#000; border-top:1px solid var(--line); }
  #role-switch a { flex:1; text-align:center; padding:10px; color:var(--muted); text-decoration:none; font:500 13px Oswald, sans-serif; letter-spacing:.1em; text-transform:uppercase; }
  #role-switch a[aria-current] { color:#111; background:var(--y); }
  @media (max-width:760px) {
    header, main { padding-left:16px; padding-right:16px; }
    .clock { display:none; }
    h1 { font-size:26px; }
    .tiles { grid-template-columns:1fr 1fr; }
    .tile b { font-size:34px; }
    .board thead { display:none; }
    .board, .board tbody, .board tr, .board td { display:block; }
    .board tr { margin-bottom:6px; }
    .board td { padding:4px 14px; } .board td:first-child { padding-top:12px; } .board td:last-child { padding-bottom:12px; text-align:left; }
  }
</style>
</head>
<body>
<header><span class="brand">Select<span>Profi</span></span><nav id="nav"></nav><span class="clock">09:41</span></header>
<main>
  <div class="head"><h1 id="greeting"></h1><button class="btn" id="action"></button></div>
  <div class="tiles" id="tiles"></div>
  <table class="board" id="board"></table>
  <div class="ticker" id="ticker"></div>
</main>
<div id="role-switch"></div>
<script src="shared.js"></script>
<script>
SP.mount((key, r) => {
  const $ = (id) => document.getElementById(id)
  $('nav').innerHTML = r.nav.map((n) => `<a href="#">${n}</a>`).join('')
  $('greeting').textContent = r.greeting
  $('action').textContent = r.primaryAction
  $('tiles').innerHTML = r.stats.map((s) => `<div class="tile"><span>${s.label}</span><b>${s.value}</b><small>${s.note}</small></div>`).join('')
  const statusText = { ok: 'По плану', warn: 'Ждёт действия', idle: 'Ожидание' }
  $('board').innerHTML = `<thead><tr><th>${r.list.columns[0]}</th><th>${r.list.columns[1]}</th><th>${r.list.columns[2]}</th><th>Статус</th><th style="text-align:right">${r.list.columns[4]}</th></tr></thead><tbody>` +
    r.list.rows.map((row, i) => `<tr><td>${row[0]}</td><td>${row[1]}</td><td>${row[2]}</td><td><span class="st ${r.list.status[i]}">${statusText[r.list.status[i]]}</span></td><td class="num">${row[4]}</td></tr>`).join('') + '</tbody>'
  $('ticker').innerHTML = r.timeline.map((t) => `<span><b>${t.time}</b>${t.text}</span>`).join('')
})
</script>
</body>
</html>
