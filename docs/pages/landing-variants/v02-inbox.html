<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>02 · Лента дел</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Palette kept: teal + sage. Layout: single reading column, no sidebar, actions first. */
  :root { --bg:#fff; --sub:#F4F8F6; --line:#E3ECE8; --text:#12201C; --muted:#5A716B; --primary:#0F766E; --soft:#E6F2EF; --warn:#B45309; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.55 'Golos Text', system-ui, sans-serif; }
  header { border-bottom:1px solid var(--line); }
  .bar { max-width:760px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:20px; }
  .logo { font-weight:600; }
  .logo span { color:var(--primary); }
  nav { display:flex; gap:18px; overflow-x:auto; font-size:14px; }
  nav a { color:var(--muted); text-decoration:none; white-space:nowrap; padding:4px 0; border-bottom:2px solid transparent; }
  nav a:first-child { color:var(--text); border-color:var(--primary); }
  .avatar { margin-left:auto; width:32px; height:32px; border-radius:50%; background:var(--soft); color:var(--primary); display:grid; place-items:center; font-size:12px; font-weight:600; flex:none; }
  main { max-width:760px; margin:0 auto; padding:36px 20px 96px; }
  .hello { font-size:14px; color:var(--muted); margin:0; }
  h1 { font-size:30px; line-height:1.2; font-weight:600; margin:6px 0 14px; letter-spacing:-.015em; }
  .summary { color:var(--muted); margin:0 0 28px; }
  .summary b { color:var(--text); font-weight:600; }
  .actions { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:40px; }
  .btn { border:1px solid var(--line); background:#fff; border-radius:999px; padding:8px 16px; font:inherit; font-size:14px; cursor:pointer; }
  .btn.primary { background:var(--primary); color:#fff; border-color:var(--primary); }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:500; margin:0 0 8px; }
  .items { list-style:none; margin:0 0 36px; padding:0; }
  .items li { display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:baseline; padding:14px 0; border-bottom:1px solid var(--line); }
  .tag { font-size:12px; color:var(--primary); background:var(--soft); padding:2px 8px; border-radius:4px; white-space:nowrap; }
  .urgent .tag { color:#fff; background:var(--warn); }
  .meta { color:var(--muted); font-size:14px; white-space:nowrap; }
  .go { color:var(--primary); text-decoration:none; font-size:14px; }
  .rows li { grid-template-columns:1fr auto; }
  .rows small { display:block; color:var(--muted); font-size:13px; }
  .stage { font-size:13px; color:var(--muted); text-align:right; white-space:nowrap; }
  .stage b { display:block; color:var(--text); font-weight:500; }
  #role-switch { position:fixed; left:50%; transform:translateX(-50%); bottom:16px; display:flex; gap:2px; background:#fff; border:1px solid var(--line); padding:3px; border-radius:999px; box-shadow:0 4px 14px rgb(18 32 28 / 10%); }
  #role-switch a { text-decoration:none; color:var(--muted); font-size:13px; padding:6px 12px; border-radius:999px; }
  #role-switch a[aria-current] { background:var(--text); color:#fff; }
  @media (max-width:600px) {
    h1 { font-size:24px; }
    .items li { grid-template-columns:1fr; gap:4px; }
    .tag { justify-self:start; }
    .rows li { grid-template-columns:1fr auto; }
  }
</style>
</head>
<body>
<header><div class="bar"><div class="logo">Select<span>Profi</span></div><nav id="nav"></nav><div class="avatar" id="avatar"></div></div></header>
<main>
  <p class="hello" id="hello"></p>
  <h1 id="greeting"></h1>
  <p class="summary" id="summary"></p>
  <div class="actions" id="actions"></div>
  <h2>Сделать сейчас</h2>
  <ul class="items" id="now"></ul>
  <h2>Потом</h2>
  <ul class="items" id="later"></ul>
  <h2 id="list-title"></h2>
  <ul class="items rows" id="rows"></ul>
</main>
<div id="role-switch"></div>
<script src="shared.js"></script>
<script>
SP.mount((key, r) => {
  const $ = (id) => document.getElementById(id)
  $('nav').innerHTML = r.nav.map((n) => `<a href="#">${n}</a>`).join('')
  $('avatar').textContent = SP.initials(r.user)
  $('hello').textContent = `Доброе утро, ${r.user.split(' ')[0]}`
  $('greeting').textContent = r.greeting
  $('summary').innerHTML = r.stats.map((s) => `<b>${s.value}</b> ${s.label.toLowerCase()}`).join(' · ')
  $('actions').innerHTML = `<button class="btn primary">${r.primaryAction}</button><button class="btn">${r.nav[1]}</button>`
  const item = (t) => `<li class="${t.urgent ? 'urgent' : ''}"><span class="tag">${t.tag}</span><span>${t.text}<br><span class="meta">${t.meta}</span></span><a class="go" href="#">Открыть →</a></li>`
  $('now').innerHTML = r.todo.slice(0, 2).map(item).join('')
  $('later').innerHTML = r.todo.slice(2).map(item).join('')
  $('list-title').textContent = r.list.title
  $('rows').innerHTML = r.list.rows.map((row) => `<li><span>${row[0]}<small>${row[1]}</small></span><span class="stage"><b>${row[2]}</b>${row[4]}</span></li>`).join('')
})
</script>
</body>
</html>
