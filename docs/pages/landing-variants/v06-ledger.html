<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>06 · Конторская книга</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* New palette: warm paper + ink blue + margin red. Ledger/notebook metaphor. */
  :root { --paper:#FBF7EF; --rule:#E7DFCD; --ink:#1E2F6B; --text:#2A2620; --muted:#7A7062; --red:#B5483B; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--text); font:15px/28px 'PT Sans', system-ui, sans-serif;
    background-image:repeating-linear-gradient(to bottom, transparent 0 27px, var(--rule) 27px 28px); }
  .page { min-height:100vh; max-width:1100px; margin:0 auto; padding:28px 32px 84px 96px; position:relative; }
  .page::before { content:''; position:absolute; top:0; bottom:0; left:72px; width:1px; background:var(--red); opacity:.6; }
  header { display:flex; justify-content:space-between; align-items:baseline; gap:16px; flex-wrap:wrap; }
  .brand { font:700 22px/28px 'PT Serif', serif; color:var(--ink); }
  nav { display:flex; gap:18px; flex-wrap:wrap; }
  nav a { color:var(--muted); text-decoration:none; }
  nav a:first-child { color:var(--ink); text-decoration:underline; text-underline-offset:6px; }
  h1 { font:700 30px/56px 'PT Serif', serif; color:var(--ink); margin:28px 0 0; }
  .lede { margin:0 0 28px; color:var(--muted); }
  .margin { position:absolute; left:8px; width:56px; text-align:right; font-size:12px; color:var(--red); }
  .tally { display:flex; flex-wrap:wrap; gap:0 40px; margin-bottom:28px; }
  .tally div { min-width:180px; }
  .tally b { font:700 28px/56px 'PT Serif', serif; color:var(--ink); display:block; }
  .tally span { display:block; line-height:28px; }
  .tally small { color:var(--muted); font-size:13px; line-height:28px; }
  h2 { font:700 18px/28px 'PT Serif', serif; color:var(--ink); margin:28px 0 0; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-weight:400; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; line-height:28px; border-bottom:1px solid var(--ink); }
  td { line-height:28px; padding:0 12px 0 0; vertical-align:top; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  tr td:first-child { color:var(--ink); }
  .check { list-style:none; padding:0; margin:0; }
  .check li { line-height:28px; display:flex; gap:12px; }
  .check li::before { content:'☐'; color:var(--ink); }
  .check .urgent::before { content:'☒'; color:var(--red); }
  .check em { color:var(--muted); font-style:normal; }
  .two { display:grid; grid-template-columns:3fr 2fr; gap:40px; }
  .stamp { display:inline-block; border:2px solid var(--ink); color:var(--ink); padding:0 14px; font-weight:700; line-height:36px; margin-top:28px; transform:rotate(-1.5deg); background:var(--paper); cursor:pointer; font-family:inherit; font-size:15px; }
  #role-switch { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); display:flex; gap:14px; background:var(--paper); border:1px solid var(--rule); padding:2px 14px; }
  #role-switch a { color:var(--muted); text-decoration:none; }
  #role-switch a[aria-current] { color:var(--red); font-weight:700; }
  @media (max-width:760px) {
    .page { padding:20px 16px 84px 40px; } .page::before { left:28px; }
    .margin { display:none; }
    .two { grid-template-columns:1fr; gap:0; }
    th:nth-child(2), td:nth-child(2) { display:none; }
    h1 { font-size:24px; line-height:28px; margin-top:28px; }
  }
</style>
</head>
<body>
<div class="page">
  <header><div class="brand">SelectProfi</div><nav id="nav"></nav></header>
  <h1 id="greeting"></h1>
  <p class="lede" id="lede"></p>
  <div class="tally" id="tally"></div>
  <div class="two">
    <section><h2 id="list-title"></h2><table id="table"></table></section>
    <section><h2>На сегодня</h2><ul class="check" id="todo"></ul><button class="stamp" id="action"></button></section>
  </div>
</div>
<div id="role-switch"></div>
<script src="shared.js"></script>
<script>
SP.mount((key, r) => {
  const $ = (id) => document.getElementById(id)
  $('nav').innerHTML = r.nav.map((n) => `<a href="#">${n}</a>`).join('')
  $('greeting').textContent = r.greeting
  $('lede').textContent = `${r.user}, ${r.company}. Понедельник, 9 ноября.`
  $('tally').innerHTML = r.stats.map((s) => `<div><b>${s.value}</b><span>${s.label}</span><small>${s.note}</small></div>`).join('')
  $('list-title').textContent = r.list.title
  $('table').innerHTML = `<tr><th>${r.list.columns[0]}</th><th>${r.list.columns[1]}</th><th>${r.list.columns[2]}</th><th style="text-align:right">${r.list.columns[4]}</th></tr>` +
    r.list.rows.map((row) => `<tr><td>${row[0]}</td><td>${row[1]}</td><td>${row[2]}</td><td class="num">${row[4]}</td></tr>`).join('')
  $('todo').innerHTML = r.todo.map((t) => `<li class="${t.urgent ? 'urgent' : ''}"><span>${t.text} <em>— ${t.meta}</em></span></li>`).join('')
  $('action').textContent = r.primaryAction
})
</script>
</body>
</html>
