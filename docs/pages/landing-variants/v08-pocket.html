<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>08 · Карманный</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* New palette: cream + terracotta + cocoa. Mobile-first: big touch cards, bottom tab bar. */
  :root { --bg:#FFF8F2; --card:#fff; --line:#F0E2D6; --text:#2B1D16; --muted:#8A7468; --accent:#C2502E; --soft:#FBE6DC; --sage:#E7EFE3; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:500 15px/1.45 Manrope, system-ui, sans-serif; }
  .layout { display:grid; grid-template-columns:minmax(0,1fr) 440px minmax(0,1fr); gap:32px; padding:32px 24px 110px; }
  .intro { grid-column:1; position:sticky; top:32px; align-self:start; justify-self:end; max-width:300px; }
  .intro .brand { font-weight:800; font-size:18px; }
  .intro .brand span { color:var(--accent); }
  .intro p { color:var(--muted); }
  .stream { grid-column:2; display:flex; flex-direction:column; gap:12px; }
  .hello { font-size:28px; line-height:1.15; font-weight:800; letter-spacing:-.02em; margin:0 0 6px; }
  .who { color:var(--muted); margin:0 0 10px; }
  .hero { background:var(--accent); color:#fff; border-radius:22px; padding:20px; }
  .hero small { opacity:.85; }
  .hero strong { display:block; font-size:19px; line-height:1.3; margin:6px 0 16px; }
  .hero button { background:#fff; color:var(--accent); border:0; border-radius:14px; padding:12px 16px; font:inherit; font-weight:700; width:100%; cursor:pointer; }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px 16px; }
  .tile b { display:block; font-size:26px; font-weight:800; }
  .tile span { color:var(--muted); font-size:13px; }
  .tile.alt { background:var(--sage); border-color:transparent; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:6px 0; }
  .card h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:10px 16px 4px; }
  .line { display:flex; align-items:center; gap:12px; padding:12px 16px; min-height:56px; }
  .line + .line { border-top:1px solid var(--line); }
  .line .ic { width:36px; height:36px; border-radius:12px; background:var(--soft); color:var(--accent); display:grid; place-items:center; font-weight:800; font-size:13px; flex:none; }
  .line small { display:block; color:var(--muted); font-size:13px; }
  .line .chev { margin-left:auto; color:var(--muted); font-size:18px; }
  .tabs { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); width:min(440px, calc(100% - 24px)); background:var(--text); color:#fff; border-radius:22px; display:flex; justify-content:space-around; padding:8px; z-index:3; }
  .tabs a { color:#CDBBB0; text-decoration:none; font-size:11px; text-align:center; padding:6px 4px; border-radius:14px; flex:1; }
  .tabs a:first-child { background:#4A352B; color:#fff; }
  #role-switch { display:flex; gap:6px; margin:18px 0; flex-wrap:wrap; }
  #role-switch a { border:1px solid var(--line); background:var(--card); border-radius:999px; padding:6px 12px; text-decoration:none; color:var(--muted); font-size:13px; }
  #role-switch a[aria-current] { border-color:var(--accent); color:var(--accent); }
  @media (max-width:900px) {
    .layout { grid-template-columns:1fr; padding:20px 16px 110px; }
    .intro { position:static; grid-column:1; justify-self:stretch; max-width:none; }
    .intro p { display:none; }
    .stream { grid-column:1; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="intro"><div class="brand">Select<span>Profi</span></div><p>Прототип «сначала телефон»: на ноутбуке экран остаётся узкой колонкой, как в мессенджере, чтобы не разъезжаться по ширине.</p><div id="role-switch"></div></aside>
  <main class="stream" id="stream"></main>
</div>
<nav class="tabs" id="tabs"></nav>
<script src="shared.js"></script>
<script>
SP.mount((key, r) => {
  const first = r.todo[0]
  document.getElementById('stream').innerHTML = `
    <div><h1 class="hello">Привет, ${r.user.split(' ')[0]}!</h1><p class="who">${r.label} · ${r.company}</p></div>
    <section class="hero"><small>${first.tag}</small><strong>${first.text}</strong><button>Открыть</button></section>
    <div class="pair">${r.stats.slice(0, 2).map((s, i) => `<div class="tile ${i ? 'alt' : ''}"><b>${s.value}</b><span>${s.label}</span></div>`).join('')}</div>
    <section class="card"><h2>Дальше по списку</h2>${r.todo.slice(1).map((t) => `<div class="line"><span class="ic">${t.tag[0]}</span><span>${t.text}<small>${t.meta}</small></span><span class="chev">›</span></div>`).join('')}</section>
    <section class="card"><h2>${r.list.title}</h2>${r.list.rows.map((row) => `<div class="line"><span>${row[0]}<small>${row[2]} · ${row[4]}</small></span><span class="chev">›</span></div>`).join('')}</section>
    <div class="pair">${r.stats.slice(2).map((s, i) => `<div class="tile ${i ? '' : 'alt'}"><b>${s.value}</b><span>${s.label}</span></div>`).join('')}</div>`
  document.getElementById('tabs').innerHTML = r.nav.slice(0, 4).map((n) => `<a href="#">${n}</a>`).join('') + `<a href="#">＋</a>`
})
</script>
</body>
</html>
