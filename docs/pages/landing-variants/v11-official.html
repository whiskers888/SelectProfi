<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>11 · Официальный: три панели + карманный</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Official HR palette: ink navy + cool greys, semantic colors only for statuses. */
  /* Brand teal from src/design/tokens.json, three shades switchable via ?palette=. */
  :root, [data-palette="brand"] {
    --bg:#F4F8F6; --surface:#fff; --sub:#F7FAF9; --line:#D7E5DF; --line-strong:#BFD5CC;
    --text:#12201C; --muted:#4E6660; --faint:#7F9690;
    --primary:#0F766E; --primary-strong:#115E59; --primary-soft:#E6F2EF; --primary-mid:#7CC4BC;
    --top:#12201C; --top-2:#1D302B; --top-line:#2E443E; --top-muted:#9DB3AC; --top-text:#E4EEEA; --ava:#0F766E;
    --ok:#1E6E47; --ok-bg:#E5F3EB; --warn:#9A5B08; --warn-bg:#FCF1DC; --info:#0F766E; --info-bg:#E6F2EF; --idle:#4E6660; --idle-bg:#EDF4F1;
    --shadow:rgb(18 32 28 / 12%);
  }
  [data-palette="deep"] {
    --bg:#F1F5F4; --sub:#F6F9F8; --line:#D2DFDA; --line-strong:#B5CAC2;
    --primary:#0B5C55; --primary-strong:#084741; --primary-soft:#E2EEEB; --primary-mid:#6FAEA6;
    --top:#0B3B37; --top-2:#124A45; --top-line:#1E5C56; --top-muted:#9CC2BC; --top-text:#E7F2F0; --ava:#14726A;
    --info:#0B5C55; --info-bg:#E2EEEB;
  }
  [data-palette="petrol"] {
    --bg:#F2F6F7; --sub:#F7FAFB; --line:#D3E0E3; --line-strong:#B6CBD0;
    --text:#13232A; --muted:#4C6470; --faint:#7D939C;
    --primary:#136F7A; --primary-strong:#0E5862; --primary-soft:#E3F0F2; --primary-mid:#78B8C0;
    --top:#0E2F38; --top-2:#163E48; --top-line:#22505B; --top-muted:#9BB9C0; --top-text:#E6F0F2; --ava:#1A7F8B;
    --info:#136F7A; --info-bg:#E3F0F2; --idle:#4C6470; --idle-bg:#EDF3F5;
    --shadow:rgb(14 47 56 / 12%);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 'IBM Plex Sans', system-ui, sans-serif; font-variant-numeric:tabular-nums; }
  button { font:inherit; }
  svg.i { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  .pill { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; padding:2px 8px; border-radius:4px; white-space:nowrap; }
  .pill::before { content:''; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .ok { color:var(--ok); background:var(--ok-bg); } .warn { color:var(--warn); background:var(--warn-bg); }
  .info { color:var(--info); background:var(--info-bg); } .idle { color:var(--idle); background:var(--idle-bg); }
  .btn { border:1px solid var(--line-strong); background:var(--surface); color:var(--text); border-radius:6px; padding:8px 14px; font-weight:500; cursor:pointer; white-space:nowrap; }
  .btn.primary { background:var(--primary); border-color:var(--primary); color:#fff; }
  .btn.primary:hover { background:var(--primary-strong); }
  .btn:focus-visible, a:focus-visible { outline:2px solid var(--primary); outline-offset:2px; }

  /* ---------- Web: top bar + three panes ---------- */
  #web { display:grid; grid-template-rows:auto 1fr; height:100vh; }
  .topbar { background:var(--top); color:var(--top-text); display:flex; align-items:center; gap:20px; padding:0 20px; height:56px; }
  .brand { font-weight:700; letter-spacing:.01em; display:flex; align-items:center; gap:10px; }
  .brand b { width:30px; height:30px; border-radius:6px; background:#fff; color:var(--top); display:grid; place-items:center; font-size:12px; }
  .brand small { font-weight:400; color:var(--top-muted); border-left:1px solid var(--top-line); padding-left:10px; }
  .search { flex:1; max-width:520px; display:flex; align-items:center; gap:8px; background:var(--top-2); border:1px solid var(--top-line); border-radius:6px; padding:7px 12px; color:var(--top-muted); }
  .topbar .right { margin-left:auto; display:flex; align-items:center; gap:16px; }
  .bell { position:relative; color:var(--top-text); }
  .bell i { position:absolute; top:-4px; right:-6px; background:#E0A43A; color:var(--top); font:600 10px/16px 'IBM Plex Sans'; font-style:normal; min-width:16px; text-align:center; border-radius:8px; }
  .user { display:flex; align-items:center; gap:10px; text-align:right; font-size:13px; }
  .user small { display:block; color:var(--top-muted); font-size:12px; }
  .ava { width:34px; height:34px; border-radius:50%; background:var(--ava); color:#fff; display:grid; place-items:center; font-weight:600; font-size:12px; }
  .panes { display:grid; grid-template-columns:232px 380px minmax(0,1fr); min-height:0; }
  .nav { background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:14px 10px; min-height:0; }
  .nav .role { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); padding:4px 10px 8px; }
  .nav a { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:6px; color:var(--muted); text-decoration:none; }
  .nav a:hover { background:var(--sub); }
  .nav a.active { background:var(--primary-soft); color:var(--primary); font-weight:600; }
  .nav a em { margin-left:auto; font-style:normal; font-size:12px; color:var(--faint); }
  .nav a.active em { color:var(--primary); }
  .nav .primary-action { margin:6px 0 14px; width:100%; }
  .wallet { margin-top:auto; border:1px solid var(--line); border-radius:8px; padding:12px; background:var(--sub); }
  .wallet div { display:flex; justify-content:space-between; gap:8px; font-size:13px; }
  .wallet div + div { margin-top:6px; }
  .wallet span { color:var(--muted); }
  .wallet b { white-space:nowrap; }
  .wallet .org { font-size:12px; color:var(--muted); border-top:1px solid var(--line); margin-top:10px; padding-top:8px; display:block; }
  .list { background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  .list header { padding:16px 16px 10px; border-bottom:1px solid var(--line); }
  .list h1 { font-size:16px; margin:0 0 10px; display:flex; justify-content:space-between; align-items:center; }
  .list h1 select { font:inherit; font-size:12px; color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:2px 4px; background:var(--surface); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chips span { font-size:12px; padding:3px 9px; border:1px solid var(--line); border-radius:4px; color:var(--muted); cursor:pointer; }
  .chips span:first-child { border-color:var(--primary); color:var(--primary); background:var(--primary-soft); }
  .scroll { overflow:auto; }
  .group { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); padding:14px 16px 6px; background:var(--sub); border-bottom:1px solid var(--line); }
  .row { padding:12px 16px; border-bottom:1px solid var(--line); cursor:pointer; display:grid; gap:4px; }
  .row:hover { background:var(--sub); }
  .row.active { background:var(--primary-soft); box-shadow:inset 3px 0 0 var(--primary); }
  .row .l1 { display:flex; justify-content:space-between; gap:8px; font-size:12px; color:var(--faint); }
  .row strong { font-weight:600; }
  .row .l3 { display:flex; justify-content:space-between; gap:8px; align-items:center; color:var(--muted); font-size:13px; }
  .detail { overflow:auto; padding:20px 28px 40px; min-width:0; }
  .crumbs { font-size:12px; color:var(--faint); }
  .crumbs b { color:var(--muted); font-weight:500; }
  .dhead { display:flex; justify-content:space-between; gap:20px; align-items:flex-start; margin:6px 0 14px; flex-wrap:wrap; }
  .dhead h2 { font-size:22px; line-height:1.25; margin:0 0 4px; font-weight:600; }
  .dhead .num { color:var(--muted); font-size:13px; }
  .notice { display:flex; gap:12px; background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--warn); border-radius:6px; padding:12px 14px; margin-bottom:16px; }
  .notice.okb { border-left-color:var(--ok); }
  .notice p { margin:0 0 10px; }
  .notice .btns { display:flex; gap:8px; flex-wrap:wrap; }
  .steps { display:flex; margin:0 0 18px; padding:0; list-style:none; background:var(--surface); border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .steps li { flex:1; font-size:12px; padding:9px 6px 9px 14px; color:var(--faint); position:relative; white-space:nowrap; }
  .steps li + li { border-left:1px solid var(--line); }
  .steps li.done { color:var(--muted); }
  .steps li.done::before { content:'✓ '; color:var(--ok); }
  .steps li.now { color:var(--primary); font-weight:600; background:var(--primary-soft); }
  .facts { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); background:var(--surface); border:1px solid var(--line); border-radius:6px; margin:0 0 18px; }
  .facts div { padding:10px 14px; border-bottom:1px solid var(--line); }
  .facts div:not(:nth-child(3n+1)) { border-left:1px solid var(--line); }
  .facts div:nth-last-child(-n+3) { border-bottom:0; }
  .facts dt { font-size:12px; color:var(--faint); }
  .facts dd { margin:2px 0 0; font-weight:500; }
  .tabs { display:flex; gap:20px; border-bottom:1px solid var(--line); margin-bottom:14px; }
  .tabs span { padding:8px 0; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tabs span:first-child { color:var(--text); font-weight:600; border-color:var(--primary); }
  .twocol { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:20px; align-items:start; }
  td:nth-child(n+2) { white-space:nowrap; }
  table { width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; font-weight:500; color:var(--muted); background:var(--sub); }
  tr:last-child td { border-bottom:0; }
  td:first-child { font-weight:500; }
  .score { display:inline-block; min-width:38px; font-weight:600; color:var(--ok); }
  .tnote { font-size:12px; color:var(--muted); margin:8px 0 0; }
  .side h3 { font-size:13px; margin:0 0 8px; font-weight:600; }
  .box { background:var(--surface); border:1px solid var(--line); border-radius:6px; margin-bottom:16px; }
  .doc { display:flex; gap:10px; padding:10px 12px; align-items:flex-start; }
  .doc + .doc { border-top:1px solid var(--line); }
  .doc small { display:block; color:var(--muted); font-size:12px; }
  .doc .i { color:var(--primary); margin-top:2px; }
  .hist { list-style:none; margin:0; padding:4px 12px; }
  .hist li { padding:8px 0 8px 14px; border-left:2px solid var(--line); position:relative; font-size:13px; }
  .hist li::before { content:''; position:absolute; left:-5px; top:13px; width:8px; height:8px; border-radius:50%; background:var(--surface); border:2px solid var(--line-strong); }
  .hist time { display:block; font-size:12px; color:var(--faint); }

  /* ---------- Pocket (mobile) ---------- */
  #pocket { display:none; padding:0 0 96px; }
  .m-top { background:var(--top); color:#fff; padding:52px 16px 56px; }
  .m-top .line1 { display:flex; justify-content:space-between; align-items:center; }
  .m-top h1 { font-size:22px; margin:14px 0 2px; font-weight:600; }
  .m-top p { margin:0; color:var(--top-muted); font-size:13px; }
  .m-body { padding:0 16px; margin-top:-40px; display:flex; flex-direction:column; gap:12px; }
  .hero { background:var(--surface); border-radius:12px; border:1px solid var(--line); padding:16px; box-shadow:0 6px 18px var(--shadow); }
  .hero .pill { margin-bottom:8px; }
  .hero strong { display:block; font-size:17px; line-height:1.35; }
  .hero small { display:block; color:var(--muted); margin:4px 0 14px; }
  .hero .btn { width:100%; padding:12px; }
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .tile { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .tile b { display:block; font-size:22px; font-weight:600; }
  .tile span { font-size:12px; color:var(--muted); }
  .m-card { background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .m-card h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); margin:0; padding:12px 14px 6px; font-weight:500; }
  .m-row { display:flex; gap:12px; align-items:center; padding:12px 14px; border-top:1px solid var(--line); min-height:60px; }
  .m-row .t { flex:1; min-width:0; }
  .m-row strong { display:block; font-weight:600; }
  .m-row small { display:block; color:var(--muted); font-size:12px; }
  .m-row .chev { color:var(--faint); font-size:20px; }
  .m-steps { display:flex; gap:4px; padding:4px 14px 14px; }
  .m-steps i { flex:1; height:4px; border-radius:2px; background:var(--line); }
  .m-steps i.done { background:var(--primary); } .m-steps i.now { background:var(--primary-mid); }
  .m-tabs { position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--line); display:flex; padding:6px 6px calc(6px + env(safe-area-inset-bottom)); z-index:5; }
  .m-tabs a { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:11px; color:var(--faint); text-decoration:none; padding:4px 0; }
  .m-tabs a.active { color:var(--primary); font-weight:600; }
  .fab { position:fixed; right:16px; bottom:76px; background:var(--primary); color:#fff; border:0; border-radius:999px; padding:12px 18px; font-weight:600; box-shadow:0 8px 20px var(--shadow); z-index:5; }

  #role-switch, #palette-switch { position:fixed; left:12px; bottom:12px; display:flex; background:var(--top); border-radius:6px; padding:3px; z-index:10; }
  #role-switch a { color:var(--top-muted); text-decoration:none; font-size:12px; padding:5px 10px; border-radius:4px; }
  #role-switch a[aria-current], #palette-switch a[aria-current] { background:#fff; color:var(--top); }
  #palette-switch { left:auto; right:12px; }
  #palette-switch a { color:var(--top-muted); text-decoration:none; font-size:12px; padding:5px 10px; border-radius:4px; display:flex; align-items:center; gap:6px; }
  #palette-switch i { width:10px; height:10px; border-radius:50%; }

  /* Below 1600px documents and history move under the table, side by side. */
  @media (max-width:1600px) { .twocol { grid-template-columns:1fr; } .side { display:grid; grid-template-columns:1fr 1fr; gap:0 20px; } .side h3:nth-of-type(2) { grid-column:2; grid-row:1; } .side .box:nth-of-type(2) { grid-column:2; grid-row:2; } td:nth-child(2) { white-space:normal; } }
  @media (max-width:1280px) { .panes { grid-template-columns:210px 320px minmax(0,1fr); } .facts { grid-template-columns:1fr 1fr; } .facts div:not(:nth-child(3n+1)) { border-left:0; } .facts div:nth-child(even) { border-left:1px solid var(--line); } .facts div:nth-last-child(-n+3) { border-bottom:1px solid var(--line); } .facts div:nth-last-child(-n+2) { border-bottom:0; } }
  @media (max-width:1023px) {
    #web { display:none; } #pocket { display:block; }
    #role-switch { left:50%; transform:translateX(-50%); bottom:auto; top:10px; }
    #palette-switch { right:50%; transform:translateX(50%); bottom:auto; top:44px; }
    .m-top { padding-top:86px; }
  }
</style>
</head>
<body>
<div id="web">
  <div class="topbar">
    <div class="brand"><b>КТ</b>КадрыТут<small>Подбор персонала</small></div>
    <div class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></svg>Поиск по заказам, кандидатам, документам</div>
    <div class="right"><span class="bell"><svg class="i" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20h4"/></svg><i>3</i></span><div class="user" id="user"></div></div>
  </div>
  <div class="panes">
    <nav class="nav" id="nav"></nav>
    <section class="list"><header><h1 id="list-title"></h1><div class="chips" id="chips"></div></header><div class="scroll" id="rows"></div></section>
    <section class="detail" id="detail"></section>
  </div>
</div>
<div id="pocket"></div>
<div id="role-switch"></div>
<div id="palette-switch"></div>
<script src="shared.js"></script>
<script src="v11-official-data.js"></script>
<script>
const ICON = {
  case: '<path d="M4 7h16v12H4z"/><path d="M9 7V5h6v2"/>', users: '<circle cx="9" cy="8" r="3"/><path d="M3 19c0-3 3-5 6-5s6 2 6 5"/><path d="M16 11a3 3 0 1 0 0-6M18 19c0-2-1-4-3-4.5"/>',
  calendar: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>', chat: '<path d="M5 5h14v10H9l-4 4z"/>',
  doc: '<path d="M6 3h9l3 3v15H6z"/><path d="M9 10h6M9 14h6"/>', chart: '<path d="M5 20V10M12 20V4M19 20v-7"/>', search: '<circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/>', user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
}
const icon = (name) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[name] ?? ICON.doc}</svg>`
const $ = (id) => document.getElementById(id)
const params = new URLSearchParams(location.search)
const PALETTES = { brand: ['Фирменный', '#0F766E'], deep: ['Глубокий', '#0B5C55'], petrol: ['Петроль', '#136F7A'] }
const palette = PALETTES[params.get('palette')] ? params.get('palette') : 'brand'
document.documentElement.dataset.palette = palette

SP.mount((key) => {
  // Keep the chosen palette when switching roles and vice versa.
  document.querySelectorAll('#role-switch a').forEach((a) => { a.href = `?role=${new URLSearchParams(a.search).get('role')}&palette=${palette}` })
  $('palette-switch').innerHTML = Object.entries(PALETTES).map(([id, [name, color]]) => `<a href="?role=${key}&palette=${id}" ${id === palette ? 'aria-current="page"' : ''}><i style="background:${color}"></i>${name}</a>`).join('')
  const r = SP11[key]
  const d = r.detail
  $('user').innerHTML = `<span>${r.user}<small>${r.label} · ${r.position}</small></span><span class="ava">${SP.initials(r.user)}</span>`
  $('nav').innerHTML = `<div class="role">${r.label}</div><button class="btn primary primary-action">${r.mobile.fab}</button>` +
    r.nav.map((n, i) => `<a href="#" class="${i === 0 ? 'active' : ''}">${icon(n.icon)}${n.label}${n.count != null ? `<em>${n.count}</em>` : ''}</a>`).join('') +
    `<div class="wallet">${r.balance.map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join('')}<span class="org">${r.org}<br>${r.inn}</span></div>`
  $('list-title').innerHTML = `${r.listTitle}<select aria-label="Сортировка"><option>По сроку</option><option>По дате</option></select>`
  $('chips').innerHTML = r.filters.map((f) => `<span>${f}</span>`).join('')
  $('rows').innerHTML = r.groups.map((g) => `<div class="group">${g.title}</div>` + g.items.map((it) =>
    `<div class="row ${it.active ? 'active' : ''}"><div class="l1"><span>№ ${it.id}</span><span>${it.due}</span></div><strong>${it.title}</strong><div class="l3"><span>${it.sub}</span><span class="pill ${it.tone}">${it.status}</span></div></div>`).join('')).join('')

  const steps = d.steps.map((s, i) => `<li class="${i < d.stepIndex ? 'done' : i === d.stepIndex ? 'now' : ''}">${s}</li>`).join('')
  const table = `<table><thead><tr>${d.table.columns.map((c) => `<th>${c}</th>`).join('')}</tr></thead><tbody>${d.table.rows.map((row) => `<tr>${row.map((c, j) => `<td>${/%$/.test(c) ? `<span class="score">${c}</span>` : c}</td>`).join('')}</tr>`).join('')}</tbody></table>${d.table.note ? `<p class="tnote">${d.table.note}</p>` : ''}`
  $('detail').innerHTML = `<div class="crumbs">${d.crumbs.map((c, i) => (i === d.crumbs.length - 1 ? `<b>${c}</b>` : c)).join(' / ')}</div>
    <div class="dhead"><div><h2>${d.title}</h2><div class="num">${d.number}</div></div><span class="pill ${d.tone}">${d.status}</span></div>
    <div class="notice ${d.tone === 'ok' ? 'okb' : ''}"><div><p>${d.subtitle}</p><div class="btns">${d.actions.map((a, i) => `<button class="btn ${i === 0 ? 'primary' : ''}">${a}</button>`).join('')}</div></div></div>
    <ol class="steps">${steps}</ol>
    <dl class="facts">${d.facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>
    <div class="tabs">${d.tabs.map((t) => `<span>${t}</span>`).join('')}</div>
    <div class="twocol"><section><h3 style="font-size:13px;margin:0 0 8px">${d.table.title}</h3>${table}</section>
      <aside class="side"><h3>Документы</h3><div class="box">${d.docs.map((doc) => `<div class="doc">${icon('doc')}<div>${doc.name}<small>${doc.meta}</small></div></div>`).join('')}</div>
      <h3>История</h3><div class="box"><ul class="hist">${d.history.map((h) => `<li><time>${h.time}</time><b>${h.who}</b> ${h.text}</li>`).join('')}</ul></div></aside></div>`

  const m = r.mobile
  const tabIcons = ['case', 'search', 'users', 'user']
  $('pocket').innerHTML = `<div class="m-top"><div class="line1"><div class="brand"><b>КТ</b>КадрыТут</div><span class="bell">${icon('chat')}</span></div><h1>Здравствуйте, ${r.user.split(' ')[0]}</h1><p>${r.label} · ${r.position}</p></div>
    <div class="m-body">
      <section class="hero"><span class="pill ${d.tone}">${m.hero.tag}</span><strong>${m.hero.title}</strong><small>${m.hero.meta}</small><button class="btn primary">${m.hero.action}</button></section>
      <div class="tiles">${m.tiles.map(([v, l]) => `<div class="tile"><b>${v}</b><span>${l}</span></div>`).join('')}</div>
      <section class="m-card"><h2>${d.title} · этапы</h2><div class="m-steps">${d.steps.map((_, i) => `<i class="${i < d.stepIndex ? 'done' : i === d.stepIndex ? 'now' : ''}"></i>`).join('')}</div>
        ${d.table.rows.slice(0, 3).map((row) => `<div class="m-row"><div class="t"><strong>${row[0]}</strong><small>${row.slice(1, 3).join(' · ')}</small></div><span class="chev">›</span></div>`).join('')}</section>
      ${r.groups.map((g) => `<section class="m-card"><h2>${g.title}</h2>${g.items.map((it) => `<div class="m-row"><div class="t"><strong>${it.title}</strong><small>№ ${it.id} · ${it.sub} · ${it.due}</small></div><span class="pill ${it.tone}">${it.status}</span></div>`).join('')}</section>`).join('')}
      <section class="m-card"><h2>Последние события</h2>${d.history.slice(0, 3).map((h) => `<div class="m-row"><div class="t"><strong>${h.who}</strong><small>${h.text} · ${h.time}</small></div></div>`).join('')}</section>
    </div>
    <button class="fab">＋ ${m.fab}</button>
    <nav class="m-tabs">${m.tabs.map((t, i) => `<a href="#" class="${i === 0 ? 'active' : ''}">${icon(tabIcons[i])}${t}</a>`).join('')}</nav>`
})
</script>
</body>
</html>
