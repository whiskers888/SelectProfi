<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>07 · Три панели</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* New palette: cool slate + indigo. Mail-client layout: rail | inbox | open item. */
  :root { --bg:#F6F7F9; --pane:#fff; --line:#E4E7EC; --text:#101828; --muted:#667085; --accent:#4F46E5; --soft:#EEF0FF; --warn:#C4320A; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 Inter, system-ui, sans-serif; }
  .app { display:grid; grid-template-columns:64px 380px 1fr; height:100vh; }
  .rail { background:#101828; display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 0; }
  .rail .mark { color:#fff; font-weight:600; font-size:13px; margin-bottom:14px; }
  .rail a { width:44px; height:44px; border-radius:10px; display:grid; place-items:center; color:#98A2B3; text-decoration:none; }
  .rail svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .rail a:first-of-type { background:#344054; color:#fff; }
  .inbox { background:var(--pane); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  .inbox header { padding:16px 18px 10px; border-bottom:1px solid var(--line); }
  .inbox h1 { font-size:16px; margin:0 0 8px; font-weight:600; }
  .filters { display:flex; gap:6px; }
  .filters span { font-size:12px; padding:3px 10px; border-radius:999px; background:var(--bg); color:var(--muted); }
  .filters span:first-child { background:var(--soft); color:var(--accent); font-weight:500; }
  .list { overflow:auto; }
  .item { padding:12px 18px; border-bottom:1px solid var(--line); cursor:pointer; }
  .item.active { background:var(--soft); box-shadow:inset 3px 0 0 var(--accent); }
  .item .top { display:flex; justify-content:space-between; gap:8px; font-size:12px; color:var(--muted); }
  .item strong { display:block; font-weight:500; margin:2px 0; }
  .item.unread strong::before { content:''; display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--accent); margin-right:7px; vertical-align:middle; }
  .item .urgent { color:var(--warn); font-weight:500; }
  .detail { overflow:auto; padding:28px 36px; }
  .crumbs { font-size:12px; color:var(--muted); }
  .detail h2 { font-size:22px; margin:6px 0 4px; font-weight:600; letter-spacing:-.01em; }
  .detail p { color:var(--muted); margin:0 0 22px; }
  .btns { display:flex; gap:8px; margin-bottom:28px; flex-wrap:wrap; }
  .btn { border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px 14px; font:inherit; font-weight:500; cursor:pointer; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  h3 { font-size:13px; font-weight:600; margin:0 0 8px; color:var(--muted); }
  .people { border:1px solid var(--line); border-radius:10px; background:#fff; margin-bottom:24px; }
  .person { display:flex; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px solid var(--line); }
  .person:last-child { border-bottom:0; }
  .ava { width:34px; height:34px; border-radius:50%; background:var(--soft); color:var(--accent); display:grid; place-items:center; font-size:12px; font-weight:600; flex:none; }
  .person small { display:block; color:var(--muted); }
  .person em { margin-left:auto; font-style:normal; font-size:12px; color:var(--muted); white-space:nowrap; }
  .facts { display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; }
  .facts div { background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px; }
  .facts b { display:block; font-size:20px; font-weight:600; }
  .facts span { font-size:12px; color:var(--muted); }
  #role-switch { position:fixed; top:14px; right:20px; display:flex; background:#fff; border:1px solid var(--line); border-radius:8px; padding:2px; }
  #role-switch a { padding:5px 10px; font-size:12px; color:var(--muted); text-decoration:none; border-radius:6px; }
  #role-switch a[aria-current] { background:var(--text); color:#fff; }
  @media (max-width:1000px) { .app { grid-template-columns:64px 320px 1fr; } .facts { grid-template-columns:1fr 1fr; } }
  @media (max-width:760px) {
    .app { grid-template-columns:1fr; height:auto; }
    .rail { flex-direction:row; justify-content:space-around; position:fixed; bottom:0; left:0; right:0; padding:6px; z-index:3; }
    .rail .mark { display:none; }
    .inbox { border-right:0; }
    .detail { padding:20px 16px 90px; border-top:8px solid var(--bg); }
    #role-switch { position:static; margin:10px 16px 0; justify-content:center; }
  }
</style>
</head>
<body>
<div id="role-switch"></div>
<div class="app">
  <nav class="rail" id="rail"></nav>
  <section class="inbox"><header><h1 id="inbox-title"></h1><div class="filters"><span>Все</span><span>Важное</span><span>События</span></div></header><div class="list" id="list"></div></section>
  <section class="detail" id="detail"></section>
</div>
<script src="shared.js"></script>
<script>
SP.mount((key, r) => {
  const $ = (id) => document.getElementById(id)
  const icons = { 'заказ': '<path d="M4 7h16v12H4z"/><path d="M9 7V5h6v2"/>', 'проект': '<path d="M4 7h16v12H4z"/><path d="M9 7V5h6v2"/>', 'отклик': '<path d="M4 12l5 5L20 6"/>', 'биржа': '<circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/>', 'база': '<circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/>', 'кандидат': '<circle cx="9" cy="8" r="3"/><path d="M3 19c0-3 3-5 6-5s6 2 6 5"/><path d="M16 11a3 3 0 1 0 0-6M18 19c0-2-1-4-3-4.5"/>', 'резюме': '<path d="M6 3h9l3 3v15H6z"/><path d="M9 10h6M9 14h6"/>', 'встреч': '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>', 'чат': '<path d="M5 5h14v10H9l-4 4z"/>', 'аналитик': '<path d="M5 20V10M12 20V4M19 20v-7"/>', 'документ': '<path d="M6 3h9l3 3v15H6z"/><path d="M9 10h6M9 14h4"/>' }
  const icon = (n) => { const key = Object.keys(icons).find((k) => n.toLowerCase().includes(k)); return `<svg viewBox="0 0 24 24" aria-hidden="true">${icons[key] ?? icons['документ']}</svg>` }
  $('rail').innerHTML = `<span class="mark">SP</span>` + r.nav.map((n) => `<a href="#" title="${n}" aria-label="${n}">${icon(n)}</a>`).join('')
  $('inbox-title').textContent = r.greeting
  const todo = r.todo.map((t, i) => `<div class="item ${i === 0 ? 'active unread' : 'unread'}"><div class="top"><span class="${t.urgent ? 'urgent' : ''}">${t.tag}</span><span>сегодня</span></div><strong>${t.text}</strong><span style="color:var(--muted)">${t.meta}</span></div>`)
  const events = r.timeline.map((t) => `<div class="item"><div class="top"><span>Событие</span><span>${t.time}</span></div><strong>${t.text}</strong></div>`)
  $('list').innerHTML = todo.concat(events).join('')
  const first = r.todo[0]
  $('detail').innerHTML = `<div class="crumbs">${r.label} · ${first.tag}</div><h2>${first.text}</h2><p>${first.meta}</p>
    <div class="btns"><button class="btn primary">Открыть</button><button class="btn">${r.primaryAction}</button><button class="btn">Отложить</button></div>
    <h3>${r.people.title}</h3><div class="people">${r.people.items.map((p) => `<div class="person"><span class="ava">${SP.initials(p.name)}</span><span>${p.name}<small>${p.sub}</small></span><em>${p.stage}</em></div>`).join('')}</div>
    <h3>Коротко</h3><div class="facts">${r.stats.map((s) => `<div><b>${s.value}</b><span>${s.label}</span></div>`).join('')}</div>`
})
</script>
</body>
</html>
