services:
  postgres:
    image: postgres:16
    container_name: kadrytu-postgres
    environment:
      POSTGRES_DB: kadrytu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - kadrytu-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kadrytu"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: kadrytu-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=kadrytu;Username=postgres;Password=postgres
    ports:
      - "5008:8080"

  frontend:
    build:
      context: ./frontend
    container_name: kadrytu-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  kadrytu-pgdata:
